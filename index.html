<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Al Fakhoora Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap">
<style>
/* Layout concept: frosted-glass panels floating over a slow, colourful light field (Apple glass language).
   Overview reads people first; Financials mirrors the finance workbook; Timeline shows money moving through time. */
:root{
  --bg:#EDF0F6;
  --blob-1:#FF6B7A; --blob-2:#5B8CFF; --blob-3:#2FD3C0; --blob-4:#FFC15E; --blob-5:#A48BFF;
  --glass:rgba(255,255,255,.56); --glass-2:rgba(255,255,255,.74); --glass-3:rgba(255,255,255,.34);
  --edge:rgba(255,255,255,.85); --edge-2:rgba(255,255,255,.45);
  --hair:rgba(16,24,40,.09); --hair-2:rgba(16,24,40,.16);
  --ink:#0B1220; --ink-2:#384357; --muted:#677289;
  --accent:#D32737; --accent-2:#FF4D5E; --accent-soft:rgba(211,39,55,.12);
  --sch:#0A84FF; --emg:#FF6B4A; --skl:#22B573;
  --tr:#5E5CE6; --tr-2:#8E8CFF; --spent:#12A7B8; --plan:#B9B8F5; --ptn:#A3ACBD;
  --over:#F29A00; --over-ink:#9A5B00; --good:#1A9E55;
  --shadow:0 1px 1px rgba(16,24,40,.04), 0 18px 50px -24px rgba(16,24,40,.35);
  --shadow-lift:0 2px 2px rgba(16,24,40,.05), 0 28px 60px -22px rgba(16,24,40,.45);
  --font:"Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#070A13;
  --blob-1:#8E1E33; --blob-2:#1F3F9E; --blob-3:#0D6E69; --blob-4:#7A4B0E; --blob-5:#4B2E9E;
  --glass:rgba(24,29,43,.55); --glass-2:rgba(30,36,52,.78); --glass-3:rgba(24,29,43,.32);
  --edge:rgba(255,255,255,.14); --edge-2:rgba(255,255,255,.07);
  --hair:rgba(255,255,255,.08); --hair-2:rgba(255,255,255,.15);
  --ink:#F3F6FB; --ink-2:#BDC6D6; --muted:#8C97AB;
  --accent:#FF4D5E; --accent-2:#FF7B87; --accent-soft:rgba(255,77,94,.16);
  --sch:#3D9BFF; --emg:#FF8466; --skl:#3DD68C;
  --tr:#8380FF; --tr-2:#ABA9FF; --spent:#3CC9D9; --plan:#45437E; --ptn:#5A6478;
  --over:#FFB23E; --over-ink:#FFB23E; --good:#4ADE80;
  --shadow:0 1px 1px rgba(0,0,0,.3), 0 18px 50px -24px rgba(0,0,0,.8);
  --shadow-lift:0 2px 2px rgba(0,0,0,.3), 0 28px 60px -22px rgba(0,0,0,.9);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#070A13;
  --blob-1:#8E1E33; --blob-2:#1F3F9E; --blob-3:#0D6E69; --blob-4:#7A4B0E; --blob-5:#4B2E9E;
  --glass:rgba(24,29,43,.55); --glass-2:rgba(30,36,52,.78); --glass-3:rgba(24,29,43,.32);
  --edge:rgba(255,255,255,.14); --edge-2:rgba(255,255,255,.07);
  --hair:rgba(255,255,255,.08); --hair-2:rgba(255,255,255,.15);
  --ink:#F3F6FB; --ink-2:#BDC6D6; --muted:#8C97AB;
  --accent:#FF4D5E; --accent-2:#FF7B87; --accent-soft:rgba(255,77,94,.16);
  --sch:#3D9BFF; --emg:#FF8466; --skl:#3DD68C;
  --tr:#8380FF; --tr-2:#ABA9FF; --spent:#3CC9D9; --plan:#45437E; --ptn:#5A6478;
  --over:#FFB23E; --over-ink:#FFB23E; --good:#4ADE80;
  --shadow:0 1px 1px rgba(0,0,0,.3), 0 18px 50px -24px rgba(0,0,0,.8);
  --shadow-lift:0 2px 2px rgba(0,0,0,.3), 0 28px 60px -22px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; margin:0; font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:700; letter-spacing:-.015em}

/* ---------- light field ---------- */
.field{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
.field i{position:absolute; width:48vmax; height:48vmax; border-radius:50%; filter:blur(70px); opacity:.55; will-change:transform}
.field i:nth-child(1){background:var(--blob-1); top:-18vmax; left:-10vmax; animation:drift1 38s ease-in-out infinite alternate}
.field i:nth-child(2){background:var(--blob-2); top:-6vmax; right:-16vmax; animation:drift2 44s ease-in-out infinite alternate}
.field i:nth-child(3){background:var(--blob-3); bottom:-22vmax; left:18vmax; animation:drift3 50s ease-in-out infinite alternate}
.field i:nth-child(4){background:var(--blob-4); bottom:-14vmax; right:-6vmax; width:34vmax; height:34vmax; opacity:.42; animation:drift1 46s ease-in-out infinite alternate-reverse}
.field i:nth-child(5){background:var(--blob-5); top:32vh; left:38vw; width:30vmax; height:30vmax; opacity:.32; animation:drift2 56s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-14vmax,12vmax) scale(.92)}}
@keyframes drift3{to{transform:translate(10vmax,-12vmax) scale(1.08)}}

/* ---------- glass ---------- */
.glass{position:relative; background:var(--glass); border:1px solid var(--edge-2); border-radius:var(--r-lg);
  -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--edge), inset 0 -1px 0 rgba(255,255,255,.04), var(--shadow)}
@media (prefers-reduced-transparency: reduce){ .glass{background:var(--glass-2); -webkit-backdrop-filter:none; backdrop-filter:none} }

/* ---------- header ---------- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; padding:14px clamp(12px,2.6vw,32px) 0}
.top-in{max-width:1440px; margin:0 auto; display:flex; align-items:center; gap:18px; padding:10px 12px 10px 16px; border-radius:22px}
.brand{display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; min-width:0; flex:1 1 auto}
.mark{width:40px; height:40px; flex:none; border-radius:12px; object-fit:cover; box-shadow:0 8px 18px -8px var(--accent)}
.mark svg{width:22px; height:22px}
.brand-t{min-width:0}
.brand-t b{display:block; font-size:17px; font-weight:700; letter-spacing:-.01em; line-height:1.15}
.brand-t span{display:block; font-size:12px; color:var(--muted); line-height:1.35; max-width:62ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tabs{display:flex; gap:2px; padding:4px; border-radius:14px; background:var(--glass-3); border:1px solid var(--edge-2); position:relative; flex:none}
.tab{appearance:none; border:0; background:none; padding:8px 13px; border-radius:10px; cursor:pointer; color:var(--ink-2); font-weight:500; font-size:14px; white-space:nowrap; position:relative; z-index:1;
  transition:color 200ms ease, transform 160ms var(--ease-out)}
.tab:active{transform:scale(.96)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab-ind{position:absolute; top:4px; bottom:4px; left:0; width:0; border-radius:10px; background:var(--glass-2); box-shadow:inset 0 1px 0 var(--edge), 0 4px 14px -6px rgba(16,24,40,.35);
  transition:transform 420ms var(--ease-out), width 420ms var(--ease-out)}
.tools{display:flex; align-items:center; gap:8px; flex:none}
.gbtn{appearance:none; height:40px; min-width:40px; padding:0 14px; border-radius:12px; border:1px solid var(--edge-2); background:var(--glass-3); display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; font-weight:500; font-size:14px;
  transition:transform 160ms var(--ease-out), background-color 200ms ease}
.gbtn:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){ .gbtn:hover{background:var(--glass-2)} }
.gbtn svg{width:18px; height:18px; flex:none}
.gbtn.icon{padding:0}
.gbtn.solid{background:var(--ink); color:var(--bg); border-color:transparent}
.menu{position:absolute; right:0; top:calc(100% + 8px); min-width:250px; padding:6px; border-radius:16px; z-index:50; transform-origin:top right;
  opacity:0; transform:scale(.96) translateY(-4px); pointer-events:none; transition:opacity 160ms ease, transform 200ms var(--ease-out)}
.menu.on{opacity:1; transform:none; pointer-events:auto}
.menu button{appearance:none; width:100%; display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:center; text-align:left; padding:9px 10px; border:0; background:none; border-radius:10px; cursor:pointer}
@media (hover:hover) and (pointer:fine){ .menu button:hover{background:var(--glass-2)} }
.menu .ft{width:34px; height:34px; border-radius:9px; display:grid; place-items:center; font-size:10.5px; font-weight:700; color:#fff; letter-spacing:.02em}
.menu b{display:block; font-size:14px; font-weight:500}
.menu small{display:block; font-size:12px; color:var(--muted)}
.menu .sep{height:1px; background:var(--hair); margin:6px 8px}
.menu .note{font-size:12px; color:var(--muted); padding:6px 10px 4px}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:80; padding:12px 18px; border-radius:14px; font-size:14px; font-weight:500;
  transform:translate(-50%,20px); opacity:0; transition:transform 300ms var(--ease-out), opacity 200ms ease; pointer-events:none}
.toast.on{transform:translate(-50%,0); opacity:1}

main{position:relative; z-index:1; max-width:1440px; margin:0 auto; padding-inline:clamp(12px,2.6vw,32px); padding-block:22px 72px}
.view{display:grid; gap:20px; grid-template-columns:minmax(0,1fr)}
.view[hidden]{display:none}
.view.enter > *{animation:rise 620ms var(--ease-out) both; animation-delay:calc(var(--i,0) * 60ms)}
@keyframes rise{from{opacity:0; transform:translateY(14px); filter:blur(6px)} to{opacity:1; transform:none; filter:none}}

/* ---------- panels ---------- */
.panel{padding:22px 24px; min-width:0}
.ph{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.ph h2{font-size:19px}
.ph p{margin:3px 0 0; color:var(--muted); font-size:13px; max-width:68ch}
.grid-2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px}
.grid-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px}
.grid-12{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:20px}
.grid-21{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr); gap:20px}
.k{font-size:11.5px; font-weight:500; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
.lede{color:var(--ink-2); max-width:72ch; margin:6px 0 0}
.chartbox{position:relative; width:100%; min-width:0}
.legend{display:flex; flex-wrap:wrap; gap:8px 16px; font-size:12.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:7px}
.legend i{width:12px; height:12px; border-radius:4px; display:inline-block}

/* ---------- hero ---------- */
.hero{padding:clamp(22px,3.4vw,40px); border-radius:var(--r-xl); overflow:hidden}
.hero::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(120% 80% at 0% 0%, rgba(255,255,255,.35), transparent 55%)}
.hero-top{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; position:relative; z-index:1}
.hero h1{font-size:clamp(32px,4.6vw,58px); font-weight:900; letter-spacing:-.035em; line-height:1}
.hero h1 span{background:linear-gradient(100deg,var(--accent) 0%,var(--accent-2) 40%,var(--tr) 100%); -webkit-background-clip:text; background-clip:text; color:transparent}
.hero .tag{font-size:clamp(15px,1.4vw,18px); color:var(--ink-2); max-width:60ch; margin-top:12px; font-weight:400}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip-s{display:inline-flex; align-items:center; gap:8px; height:30px; padding:0 12px; border-radius:999px; font-size:12.5px; color:var(--ink-2); background:var(--glass-3); border:1px solid var(--edge-2)}
.chip-s .live{width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 0 0 var(--good); animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--good) 60%,transparent)} 100%{box-shadow:0 0 0 10px transparent}}
.kpis{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; margin-top:28px; position:relative; z-index:1}
.kpi{padding:16px 16px 18px; border-radius:var(--r-md); background:var(--glass-3); border:1px solid var(--edge-2); box-shadow:inset 0 1px 0 var(--edge); min-width:0;
  transition:transform 260ms var(--ease-out), background-color 200ms ease}
@media (hover:hover) and (pointer:fine){ .kpi:hover{transform:translateY(-3px); background:var(--glass-2)} }
.kpi .ic{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:#fff; margin-bottom:12px}
.kpi .ic svg{width:17px; height:17px}
.kpi .v{font-size:clamp(20px,1.85vw,28px); font-weight:700; letter-spacing:-.02em; line-height:1.05; white-space:nowrap}
.kpi .l{font-size:13px; color:var(--ink-2); margin-top:6px; line-height:1.3}
.kpi .s{font-size:11.5px; color:var(--muted); margin-top:4px}

/* ---------- scholarship bars ---------- */
.sbars{display:grid; gap:14px}
.sbar{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 92px; gap:14px; align-items:center; cursor:pointer; border:0; background:none; text-align:left; padding:4px 6px; margin:-4px -6px; border-radius:12px; transition:background-color 160ms ease}
@media (hover:hover) and (pointer:fine){ .sbar:hover{background:var(--glass-3)} }
.sbar .n{font-weight:500; font-size:14px; line-height:1.25}
.sbar .n small{display:block; color:var(--muted); font-size:12px; font-weight:400}
.track{position:relative; height:14px; border-radius:999px; background:var(--hair); overflow:hidden}
.track > i{position:absolute; left:0; top:0; bottom:0; border-radius:999px; transform-origin:left; transform:scaleX(0); transition:transform 1200ms var(--ease-out)}
.track .aw{background:linear-gradient(90deg,var(--sch),color-mix(in oklab,var(--sch) 60%,#fff))}
.track .gr{background:var(--tr); box-shadow:2px 0 0 var(--glass-2)}
.on .track > i{transform:scaleX(var(--w))}
.sbar .p{text-align:right; font-weight:700; font-size:15px}
.sbar .p small{display:block; font-weight:400; font-size:11.5px; color:var(--muted)}
.over100 .aw{background:linear-gradient(90deg,var(--skl),color-mix(in oklab,var(--skl) 55%,#fff))}

/* ---------- spotlight cards ---------- */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
.pcard{appearance:none; text-align:left; border:1px solid var(--edge-2); background:var(--glass-3); border-radius:var(--r-md); padding:16px; cursor:pointer; display:grid; gap:12px; align-content:start; box-shadow:inset 0 1px 0 var(--edge);
  transition:transform 260ms var(--ease-out), background-color 200ms ease, box-shadow 260ms ease}
.pcard:active{transform:scale(.985)}
@media (hover:hover) and (pointer:fine){ .pcard:hover{transform:translateY(-4px); background:var(--glass-2); box-shadow:inset 0 1px 0 var(--edge), var(--shadow-lift)} }
.pcard h3{font-size:15.5px; font-weight:700; line-height:1.25}
.pcard .meta{font-size:12px; color:var(--muted)}
.pcard .row{display:flex; justify-content:space-between; align-items:flex-end; gap:10px}
.ring{width:58px; height:58px; flex:none}
.ring circle{fill:none; stroke-width:6}
.ring .bg{stroke:var(--hair)}
.ring .fg{stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke-dashoffset 1400ms var(--ease-out)}
.ring text{font-size:14px; font-weight:700; fill:var(--ink); text-anchor:middle; dominant-baseline:central}
.lane{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:500; color:var(--ink-2); white-space:nowrap}
.lane::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--lc)}
.sch{--lc:var(--sch)} .emg{--lc:var(--emg)} .skl{--lc:var(--skl)}
.pill{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:500; white-space:nowrap; background:var(--glass-3); border:1px solid var(--edge-2); color:var(--ink-2)}
.pill.active{background:color-mix(in oklab,var(--good) 16%,transparent); color:var(--good); border-color:transparent}
.pill.active::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.pill.suspended,.pill.terminated{background:color-mix(in oklab,var(--over) 18%,transparent); color:var(--over-ink); border-color:transparent}
.pill.pipeline{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.pill.notapproved{color:var(--muted); text-decoration:line-through}

/* ---------- money bars (rail) ---------- */
.rail{display:flex; gap:2px; height:10px; width:100%; border-radius:999px; overflow:hidden; background:var(--hair)}
.rail .seg{height:100%; min-width:2px; transform-origin:left; animation:segIn 1100ms var(--ease-out) both; animation-delay:calc(var(--j,0) * 70ms + 150ms)}
@keyframes segIn{from{transform:scaleX(0); opacity:.4} to{transform:none; opacity:1}}
.seg.paid{background:linear-gradient(90deg,var(--tr),var(--tr-2))}
.seg.proc{background:repeating-linear-gradient(45deg,var(--tr) 0 3px,color-mix(in oklab,var(--tr) 30%,transparent) 3px 6px)}
.seg.over{background:repeating-linear-gradient(135deg,var(--over) 0 3px,color-mix(in oklab,var(--over) 35%,transparent) 3px 6px)}
.seg.pend{background:transparent}
.seg.rel{background:repeating-linear-gradient(90deg,var(--hair-2) 0 1px,transparent 1px 4px)}
.rail.big{height:22px; border-radius:12px}
.mlegend i.paid{background:linear-gradient(90deg,var(--tr),var(--tr-2))}
.mlegend i.proc{background:repeating-linear-gradient(45deg,var(--tr) 0 3px,color-mix(in oklab,var(--tr) 30%,transparent) 3px 6px)}
.mlegend i.over{background:repeating-linear-gradient(135deg,var(--over) 0 3px,color-mix(in oklab,var(--over) 35%,transparent) 3px 6px)}
.mlegend i.pend{background:var(--hair-2)}

/* ---------- projects list ---------- */
.bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px; border-radius:18px}
.seg-ctl{display:inline-flex; padding:3px; border-radius:12px; background:var(--glass-3); border:1px solid var(--edge-2); position:relative}
.seg-ctl button{appearance:none; border:0; background:none; padding:7px 14px; border-radius:9px; cursor:pointer; font-size:13.5px; font-weight:500; color:var(--ink-2); position:relative; z-index:1; transition:color 160ms ease, transform 160ms var(--ease-out)}
.seg-ctl button:active{transform:scale(.96)}
.seg-ctl button[aria-pressed="true"]{color:var(--ink)}
.seg-ctl .c{font-size:11.5px; color:var(--muted); margin-left:5px}
.seg-ind{position:absolute; top:3px; bottom:3px; left:0; border-radius:9px; background:var(--glass-2); box-shadow:inset 0 1px 0 var(--edge), 0 3px 10px -5px rgba(16,24,40,.35); transition:transform 380ms var(--ease-out), width 380ms var(--ease-out)}
.fchip{appearance:none; border:1px solid var(--edge-2); background:var(--glass-3); border-radius:999px; padding:7px 13px; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:7px; transition:opacity 160ms ease, transform 160ms var(--ease-out)}
.fchip:active{transform:scale(.96)}
.fchip::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--lc)}
.fchip[aria-pressed="false"]{opacity:.45}
.search{position:relative; margin-left:auto; flex:0 1 300px; min-width:0}
.search input{width:100%; height:38px; border-radius:12px; border:1px solid var(--edge-2); background:var(--glass-3); padding:0 12px 0 36px; font-size:14px}
.search svg{position:absolute; left:11px; top:10px; width:18px; height:18px; color:var(--muted)}
select.sort{height:38px; border-radius:12px; border:1px solid var(--edge-2); background:var(--glass-3); padding:0 10px; font-size:13.5px}
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.plist{display:grid; gap:10px}
.prow{appearance:none; width:100%; text-align:left; display:grid; grid-template-columns:minmax(0,2.2fr) 120px minmax(0,1.6fr) 130px 130px 128px; gap:18px; align-items:center; padding:16px 20px; cursor:pointer; border-radius:var(--r-md);
  transition:transform 240ms var(--ease-out), box-shadow 240ms ease, background-color 200ms ease; animation:rise 520ms var(--ease-out) both; animation-delay:calc(var(--i,0) * 35ms)}
.prow:active{transform:scale(.993)}
@media (hover:hover) and (pointer:fine){ .prow:hover{transform:translateY(-2px); background:var(--glass-2); box-shadow:inset 0 1px 0 var(--edge), var(--shadow-lift)} }
.prow .nm{display:flex; gap:12px; align-items:flex-start; min-width:0}
.prow .dot{width:10px; height:10px; border-radius:50%; background:var(--lc); margin-top:6px; flex:none; box-shadow:0 0 0 4px color-mix(in oklab,var(--lc) 20%,transparent)}
.pn{font-weight:500; font-size:15px; line-height:1.3}
.pm{font-size:12.5px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pv{text-align:right; font-size:14px; font-weight:500; white-space:nowrap}
.pv small{display:block; font-size:11.5px; font-weight:400; color:var(--muted)}
.pv.dim{color:var(--muted)}
.railbox{display:grid; gap:6px; min-width:0}
.railbox .rl{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); gap:8px}
.flag{display:inline-flex; align-items:center; gap:4px; color:var(--over-ink); font-weight:500}
.flag svg{width:13px; height:13px}
.phead{display:grid; grid-template-columns:minmax(0,2.2fr) 120px minmax(0,1.6fr) 130px 130px 128px; gap:18px; padding:0 20px; font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
.phead .r{text-align:right}
.empty{padding:48px 0; text-align:center; color:var(--muted)}
.empty b{display:block; color:var(--ink); font-size:16px; margin-bottom:6px}

/* ---------- sheet ---------- */
.scrim{position:fixed; inset:0; z-index:40; background:rgba(5,8,15,.32); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity 280ms ease}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{position:fixed; top:10px; right:10px; bottom:10px; width:min(900px,calc(100% - 20px)); z-index:41; overflow-y:auto; overscroll-behavior:contain; border-radius:26px;
  background:var(--glass-2); -webkit-backdrop-filter:blur(40px) saturate(180%); backdrop-filter:blur(40px) saturate(180%); border:1px solid var(--edge-2); box-shadow:inset 0 1px 0 var(--edge), var(--shadow-lift);
  transform:translateX(calc(100% + 20px)); visibility:hidden; transition:transform 460ms var(--ease-drawer), visibility 0s linear 460ms}
.sheet.on{transform:none; visibility:visible; transition:transform 460ms var(--ease-drawer), visibility 0s}
.sheet-top{position:sticky; top:0; z-index:3; display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 22px; background:color-mix(in oklab,var(--bg) 55%,transparent); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border-bottom:1px solid var(--hair)}
.sheet-top .crumbs{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.sheet-in{padding:22px clamp(16px,3vw,32px) 32px; display:grid; gap:18px}
.sheet-in > *{animation:rise 520ms var(--ease-out) both; animation-delay:calc(var(--i,0) * 55ms + 120ms)}
.dos-h h2{font-size:clamp(26px,3.4vw,38px); font-weight:900; letter-spacing:-.03em; line-height:1.05}
.dos-h .official{color:var(--muted); font-size:13px; margin-top:8px; max-width:72ch}
.facts{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.fact{padding:7px 12px; border-radius:12px; background:var(--glass-3); border:1px solid var(--edge-2); font-size:12.5px; color:var(--ink-2)}
.fact b{display:block; color:var(--ink); font-weight:500; font-size:13.5px}
.money{padding:22px; border-radius:var(--r-lg); display:grid; gap:16px}
.money-2{display:grid; grid-template-columns:auto minmax(0,1fr) minmax(0,1fr); gap:22px; align-items:center}
.donut-big{width:132px; height:132px}
.donut-big circle{fill:none; stroke-width:14}
.donut-big .bg{stroke:var(--hair)}
.donut-big .fg{stroke:url(#gTr); stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke-dashoffset 1500ms var(--ease-out)}
.donut-big text{fill:var(--ink); text-anchor:middle}
.money .m .v{font-size:clamp(26px,3.4vw,38px); font-weight:700; letter-spacing:-.025em; line-height:1.05; margin-top:4px}
.money .m .s{font-size:12.5px; color:var(--muted); margin-top:6px}
.money .m.tr .v{color:var(--tr)}
.money .m.rem .v{color:var(--accent)}
.mgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.mgrid > div{padding:12px 14px; border-radius:14px; background:var(--glass-3); border:1px solid var(--edge-2); min-width:0}
.mgrid .val{font-size:16px; font-weight:500; margin-top:4px}
.mgrid .sub{font-size:11.5px; color:var(--muted)}
.update{padding:20px 22px; border-radius:var(--r-lg)}
.update .body{white-space:pre-line; font-size:15px; line-height:1.6; margin-top:8px; max-width:72ch}
.stats-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px}
.stat-chip{padding:10px 14px; border-radius:14px; background:var(--glass-3); border:1px solid var(--edge-2); min-width:120px}
.stat-chip b{display:block; font-size:24px; font-weight:700; letter-spacing:-.02em; line-height:1.05}
.stat-chip span{font-size:12px; color:var(--muted)}
.ctxbox{padding:20px 22px; border-radius:var(--r-lg); display:grid; gap:12px}
.ctxbox h3{font-size:17px}
.ctxbox .st{font-size:12px; font-weight:500; color:var(--accent)}
.ctxbox ul{margin:0; padding-left:18px; display:grid; gap:6px; font-size:14px; color:var(--ink-2)}
.ctxbox .impl{font-size:14px; padding:12px 14px; border-radius:12px; background:var(--glass-3); border:1px solid var(--edge-2)}
.notes{display:grid; gap:8px}
.note{display:grid; grid-template-columns:20px minmax(0,1fr); gap:10px; font-size:13.5px; padding:12px 14px; border-radius:14px; background:color-mix(in oklab,var(--over) 14%,transparent)}
.note svg{width:17px; height:17px; color:var(--over-ink); margin-top:1px}
.tbl-wrap{overflow-x:auto; border-radius:var(--r-md)}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th{font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); text-align:left; padding:10px 12px; border-bottom:1px solid var(--hair-2); white-space:nowrap}
td{padding:10px 12px; border-bottom:1px solid var(--hair); vertical-align:middle}
tbody tr{transition:background-color 140ms ease}
@media (hover:hover) and (pointer:fine){ tbody tr:hover{background:var(--glass-3)} }
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right; white-space:nowrap}
tfoot td{font-weight:700; border-top:1px solid var(--hair-2); border-bottom:0}
tr.clk{cursor:pointer}
.st{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; white-space:nowrap; padding:3px 9px; border-radius:999px}
.st.paid{background:color-mix(in oklab,var(--tr) 16%,transparent); color:var(--tr)}
.st.proc{background:color-mix(in oklab,var(--tr) 10%,transparent); color:var(--tr); outline:1px dashed color-mix(in oklab,var(--tr) 50%,transparent)}
.st.over{background:color-mix(in oklab,var(--over) 18%,transparent); color:var(--over-ink)}
.st.pend{background:var(--glass-3); color:var(--muted)}
.st.part{background:color-mix(in oklab,var(--tr) 10%,transparent); color:var(--ink-2)}
.inbar{display:block; height:6px; border-radius:999px; background:var(--hair); overflow:hidden; margin-top:5px; min-width:60px}
.inbar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--tr),var(--tr-2)); transform-origin:left; animation:segIn 1200ms var(--ease-out) both}
.inbar.sp i{background:linear-gradient(90deg,var(--spent),color-mix(in oklab,var(--spent) 50%,#fff))}
.prose{max-width:72ch; color:var(--ink-2); white-space:pre-line; margin:0}
details.more{padding:16px 20px; border-radius:var(--r-md)}
details.more summary{cursor:pointer; font-weight:500; list-style:none; display:flex; justify-content:space-between; align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+"; color:var(--muted); font-size:20px; font-weight:300; transition:transform 200ms var(--ease-out)}
details.more[open] summary::after{transform:rotate(45deg)}
details.more > div{margin-top:12px}
.exrow{display:flex; gap:8px; flex-wrap:wrap}

/* ---------- financials ---------- */
.fkpis{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px}
.fk{padding:16px 18px; border-radius:var(--r-md); min-width:0}
.fk .v{font-size:clamp(20px,1.9vw,26px); font-weight:700; letter-spacing:-.02em; margin-top:6px; white-space:nowrap}
.fk .s{font-size:12px; color:var(--muted); margin-top:4px}
.fk .gauge{height:6px; border-radius:999px; background:var(--hair); margin-top:12px; overflow:hidden}
.fk .gauge i{display:block; height:100%; border-radius:999px; transform-origin:left; animation:segIn 1400ms var(--ease-out) both}
.queue{display:grid}
.qrow{appearance:none; width:100%; text-align:left; display:grid; grid-template-columns:62px minmax(0,1fr) auto; gap:14px; align-items:center; padding:11px 8px; margin:0 -8px; border:0; background:none; border-radius:12px; cursor:pointer; transition:background-color 140ms ease}
@media (hover:hover) and (pointer:fine){ .qrow:hover{background:var(--glass-3)} }
.cal{width:52px; height:54px; border-radius:12px; background:var(--glass-2); border:1px solid var(--edge-2); display:grid; place-items:center; text-align:center; line-height:1.05; box-shadow:inset 0 1px 0 var(--edge)}
.cal b{font-size:20px; font-weight:700; display:block}
.cal span{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.qrow.over .cal{background:color-mix(in oklab,var(--over) 22%,var(--glass-2))}
.qrow.over .cal span{color:var(--over-ink)}
.qn{font-weight:500; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.qs{font-size:12px; color:var(--muted)}
.qa{font-size:15px; font-weight:700; text-align:right; white-space:nowrap}
.qa small{display:block; font-size:11px; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
.qrow.over .qa small{color:var(--over-ink)}
.recon{display:grid; font-size:14px}
.recon div{display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-top:1px solid var(--hair)}
.recon div:first-child{border-top:0}
.recon .sub{padding-left:14px; color:var(--ink-2)}
.recon .tot{border-top:1px solid var(--hair-2); font-weight:700}
.recon .ok{color:var(--good); font-weight:700}
.filters{display:flex; gap:8px; flex-wrap:wrap}

/* ---------- timeline ---------- */
.tracker{display:grid; gap:14px}
.trow{display:grid; grid-template-columns:minmax(0,220px) minmax(0,1fr) 120px; gap:16px; align-items:center; cursor:pointer; border:0; background:none; text-align:left; padding:6px 8px; margin:-6px -8px; border-radius:14px; transition:background-color 140ms ease}
@media (hover:hover) and (pointer:fine){ .trow:hover{background:var(--glass-3)} }
.trow .n{font-weight:500; font-size:14px; line-height:1.25}
.trow .n small{display:block; color:var(--muted); font-weight:400; font-size:12px}
.steps{display:flex; gap:4px; min-width:0}
.step{flex:1 1 0; min-width:0; height:40px; border-radius:10px; position:relative; display:flex; flex-direction:column; justify-content:center; padding:0 8px; overflow:hidden;
  animation:stepIn 600ms var(--ease-out) both; animation-delay:calc(var(--j) * 90ms + var(--d,0ms))}
@keyframes stepIn{from{opacity:0; transform:translateY(8px) scale(.94)} to{opacity:1; transform:none}}
.step b{font-size:11.5px; font-weight:700; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.step span{font-size:10.5px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.85}
.step.paid{background:linear-gradient(135deg,var(--tr),var(--tr-2)); color:#fff}
.step.proc{background:repeating-linear-gradient(45deg,color-mix(in oklab,var(--tr) 75%,transparent) 0 6px,color-mix(in oklab,var(--tr) 45%,transparent) 6px 12px); color:#fff}
.step.over{background:linear-gradient(135deg,var(--over),color-mix(in oklab,var(--over) 60%,#fff)); color:#2a1700}
.step.pend{background:var(--glass-3); border:1px solid var(--hair-2); color:var(--ink-2)}
.step.now{box-shadow:0 0 0 2px var(--accent)}
.trow .t{text-align:right; font-size:13px; font-weight:500}
.trow .t small{display:block; font-size:11.5px; color:var(--muted); font-weight:400}



/* ---------- expandable sections ---------- */
.xp{border-radius:var(--r-lg); padding:0; overflow:hidden}
.xp > summary{list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:14px; padding:16px 20px; transition:background-color 160ms ease}
.xp > summary::-webkit-details-marker{display:none}
@media (hover:hover) and (pointer:fine){ .xp > summary:hover{background:var(--glass-3)} }
.xp-t{min-width:0}
.xp-t b{display:block; font-size:16px; font-weight:700; letter-spacing:-.01em}
.xp-t small{display:block; font-size:12.5px; color:var(--muted); margin-top:2px}
.chev{width:34px; height:34px; border-radius:11px; background:var(--glass-3); border:1px solid var(--edge-2); display:grid; place-items:center; flex:none; transition:transform 320ms var(--ease-out), background-color 160ms ease}
.chev::before{content:""; width:8px; height:8px; border-right:2px solid var(--ink-2); border-bottom:2px solid var(--ink-2); transform:translateY(-2px) rotate(45deg)}
.xp[open] > summary .chev{transform:rotate(180deg); background:var(--ink)}
.xp[open] > summary .chev::before{border-color:var(--bg)}
.xp-body{padding:0 20px 20px; animation:rise 420ms var(--ease-out) both}
.xp-big > summary{padding:20px 24px}
.xp-big .xp-t b{font-size:19px}
.xp-big .xp-body{padding:0 24px 24px}
.xp-group{display:grid; gap:10px}
.xp-group > .k{padding:8px 4px 0}
.morebar{display:flex; justify-content:center; margin-top:16px}
.morebtn{appearance:none; display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 18px; border-radius:999px; border:1px solid var(--edge-2); background:var(--glass-2); cursor:pointer; font-weight:500; font-size:14px; box-shadow:inset 0 1px 0 var(--edge); transition:transform 160ms var(--ease-out)}
.morebtn:active{transform:scale(.96)}
.morebtn .chev{width:22px; height:22px; border-radius:8px}
.morebtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.hidden-more{display:none !important}

/* ---------- overview filter ---------- */
.ovbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:26px; position:relative; z-index:1}
.ovbar .k{margin-right:6px}

/* ---------- qatar connection ---------- */
.journey{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; position:relative}
.jstep{appearance:none; text-align:left; border:1px solid var(--edge-2); background:var(--glass-3); border-radius:var(--r-md); padding:16px 14px; cursor:pointer; position:relative; overflow:hidden; box-shadow:inset 0 1px 0 var(--edge);
  transition:transform 260ms var(--ease-out), background-color 200ms ease}
.jstep::before{content:""; position:absolute; left:0; right:0; top:0; height:4px; background:var(--jc)}
.jstep:active{transform:scale(.98)}
@media (hover:hover) and (pointer:fine){ .jstep:hover{transform:translateY(-4px); background:var(--glass-2)} }
.jstep .y{font-size:22px; font-weight:900; letter-spacing:-.03em; color:var(--jc)}
.jstep .a{font-size:17px; font-weight:700; margin-top:6px}
.jstep .a small{font-size:12px; font-weight:400; color:var(--muted)}
.jstep .h{font-size:12.5px; color:var(--ink-2); margin-top:6px; line-height:1.35}
.pills{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.pills button{appearance:none; border:1px solid var(--edge-2); background:var(--glass-3); border-radius:999px; padding:6px 13px; font-size:13px; cursor:pointer; color:var(--ink-2); transition:background-color 160ms ease, color 160ms ease, transform 160ms var(--ease-out)}
.pills button:active{transform:scale(.96)}
.pills button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:transparent}
.pills .cnt{margin-left:auto; font-size:12.5px; color:var(--muted)}
.acts{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:12px; margin-top:14px}
.act{appearance:none; text-align:left; border:1px solid var(--edge-2); background:var(--glass-3); border-radius:var(--r-md); padding:15px 16px; cursor:pointer; display:grid; gap:8px; align-content:start; position:relative; overflow:hidden; box-shadow:inset 0 1px 0 var(--edge);
  transition:transform 240ms var(--ease-out), background-color 200ms ease; animation:rise 480ms var(--ease-out) both; animation-delay:calc(var(--i,0) * 28ms)}
.act::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--ac)}
@media (hover:hover) and (pointer:fine){ .act:hover{transform:translateY(-3px); background:var(--glass-2)} }
.act .ahd{display:flex; justify-content:space-between; gap:8px; align-items:center}
.act .fmt{font-size:11.5px; font-weight:500; color:var(--ac)}
.act .yr{font-size:11.5px; color:var(--muted); margin-left:6px}
.act .att{font-size:13px; font-weight:700}
.act .att small{font-weight:400; color:var(--muted); font-size:11px}
.act h4{font-size:14.5px; font-weight:500; line-height:1.3}
.act p{margin:0; font-size:12.5px; color:var(--ink-2); line-height:1.45; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.act .meta{display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted)}
.mstats{display:grid; gap:10px}
.mstat{display:grid; grid-template-columns:96px minmax(0,1fr); gap:14px; align-items:center; padding:12px 14px; border-radius:14px; background:var(--glass-3); border:1px solid var(--edge-2)}
.mstat b{font-size:28px; font-weight:900; letter-spacing:-.03em; color:var(--mc)}
.mstat > span{font-size:13px; color:var(--ink-2)}
.afh{border-radius:var(--r-xl); padding:clamp(20px,3vw,32px)}
.afh::before{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(90% 70% at 100% 0%, color-mix(in oklab,var(--skl) 22%,transparent), transparent 60%)}
.afh > *{position:relative}
.afh-stats{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin:20px 0}
.big-stat{padding:14px 16px; border-radius:var(--r-md); background:var(--glass-3); border:1px solid var(--edge-2)}
.big-stat b{display:block; font-size:clamp(24px,2.4vw,32px); font-weight:900; letter-spacing:-.03em; color:var(--skl)}
.big-stat > span{font-size:12.5px; color:var(--ink-2)}
.topsess{display:grid; gap:8px; margin-top:8px}
.topsess button{appearance:none; text-align:left; display:grid; grid-template-columns:70px minmax(0,1fr); gap:12px; align-items:center; padding:10px 12px; border-radius:12px; border:1px solid var(--edge-2); background:var(--glass-3); cursor:pointer}
.topsess b{font-size:18px; font-weight:900; color:var(--jc,var(--tr))}

/* ---------- country report ---------- */
.rform{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)) auto; gap:12px; align-items:end}
.rform label{display:grid; gap:6px; font-size:12px; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.rform select{height:42px; border-radius:12px; border:1px solid var(--edge-2); background:var(--glass-2); padding:0 12px; font-size:14px; text-transform:none; letter-spacing:0; color:var(--ink)}
.rhead{display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap}
.rhead h2{font-size:clamp(22px,2.6vw,30px); font-weight:900; letter-spacing:-.025em}
.placeholder{padding:56px 20px; text-align:center; color:var(--muted)}
.placeholder b{display:block; font-size:17px; color:var(--ink); margin-bottom:6px}
@media (max-width:1100px){ .journey{grid-template-columns:repeat(3,minmax(0,1fr))} .rform{grid-template-columns:repeat(2,minmax(0,1fr))} .afh-stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .journey{grid-template-columns:repeat(2,minmax(0,1fr))} .rform{grid-template-columns:minmax(0,1fr)} }

@media (max-width:1200px){
  .kpis,.fkpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .prow,.phead{grid-template-columns:minmax(0,2fr) 110px minmax(0,1.4fr) 120px 120px}
  .prow > :nth-child(6),.phead > :nth-child(6){display:none}
}
@media (max-width:980px){
  .brand-t span{display:none}
  .grid-2,.grid-3,.grid-12,.grid-21{grid-template-columns:minmax(0,1fr)}
  .phead{display:none}
  .prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-areas:"n n" "r r" "a b"; row-gap:12px}
  .prow > :nth-child(1){grid-area:n} .prow > :nth-child(2){display:none} .prow > :nth-child(3){grid-area:r}
  .prow > :nth-child(4){grid-area:a; text-align:left} .prow > :nth-child(5){grid-area:b}
  .trow{grid-template-columns:minmax(0,1fr) 100px}
  .trow .steps{grid-column:1 / -1; grid-row:2}
}
@media (max-width:760px){
  .top{padding:10px 10px 0}
  .top-in{flex-wrap:wrap; gap:10px; padding:10px}
  .tabs{order:3; width:100%; overflow-x:auto; scrollbar-width:none}
  .tab{flex:1 0 auto; padding:8px 12px}
  .gbtn .lbl{display:none}
  .gbtn{padding:0 10px}
  .kpis,.fkpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .money-2{grid-template-columns:minmax(0,1fr)}
  .donut-big{justify-self:center}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sbar{grid-template-columns:minmax(0,1fr) 80px}
  .sbar .track{grid-column:1 / -1; grid-row:2}
  .search{flex-basis:100%; margin-left:0}
  .sheet{top:0; right:0; bottom:0; width:100%; border-radius:0}
  .step span{display:none}
  .seg-ctl{max-width:100%; overflow-x:auto; scrollbar-width:none}
  .seg-ctl button{white-space:nowrap; flex:none}
}
@media (max-width:420px){ .mgrid{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms !important; animation-delay:0ms !important; transition-duration:1ms !important}
  .field i{animation:none}
}

/* partner leverage */
.lev{display:grid; align-content:start}
.lev-hero{display:grid; gap:10px; padding:18px 20px; border-radius:var(--r-md); background:linear-gradient(135deg, var(--accent-soft), color-mix(in oklab,var(--tr) 14%,transparent)); border:1px solid var(--edge-2); position:relative; overflow:hidden}
.lev-hero::after{content:""; position:absolute; right:-60px; top:-60px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, color-mix(in oklab,var(--tr) 30%,transparent), transparent 70%); animation:levGlow 6s ease-in-out infinite alternate; pointer-events:none}
@keyframes levGlow{from{transform:translate(0,0) scale(1)} to{transform:translate(-30px,20px) scale(1.15)}}
.lev-eq{display:flex; align-items:center; gap:16px; font-weight:800; letter-spacing:-.03em; line-height:1}
.lev-eq .one{font-size:clamp(34px,4vw,52px); color:var(--accent)}
.lev-eq .x{font-size:clamp(44px,5.4vw,72px); background:linear-gradient(90deg,var(--tr),var(--sch)); -webkit-background-clip:text; background-clip:text; color:transparent}
.lev-eq .arr{width:56px; height:3px; border-radius:3px; background:linear-gradient(90deg,var(--accent),var(--tr)); position:relative; flex:none}
.lev-eq .arr::after{content:""; position:absolute; right:-2px; top:-5px; border:6.5px solid transparent; border-left:9px solid var(--tr); border-right:0}
.lev-line{font-size:15px; color:var(--ink-2); max-width:56ch; margin:0}
.lev-line b{color:var(--ink)}
.lev-split{display:flex; height:14px; border-radius:999px; overflow:hidden; margin-top:18px; background:var(--glass-3); gap:3px}
.lev-split i{display:block; width:var(--w); animation:levGrow 1.4s var(--ease-out) both}
@keyframes levGrow{from{width:0}}
.lev-split .e{background:var(--accent); border-radius:999px 0 0 999px}
.lev-split .pp{background:linear-gradient(90deg,var(--tr),var(--tr-2)); border-radius:0 999px 999px 0}
.lev-k{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:12px}
.lev-k > div{display:grid; grid-template-columns:auto 1fr; column-gap:8px; align-items:center; font-size:12.5px; color:var(--muted)}
.lev-k b{grid-column:1 / -1; font-size:16px; color:var(--ink); font-weight:700; margin-top:2px}
.lev-k .dot{width:8px; height:8px; border-radius:50%}
.lev-top{display:grid; gap:4px}
.lev-top button{appearance:none; border:0; background:none; font:inherit; color:inherit; text-align:left; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 10px; margin:0 -10px; border-radius:12px; cursor:pointer; transition:background-color 140ms ease}
.lev-top button:hover{background:var(--glass-3)}
.lev-top .n{font-weight:500; min-width:0}
.lev-top small{display:block; font-size:12px; color:var(--muted); font-weight:400}
.lev-top .r{font-weight:700; font-size:17px; color:var(--tr); text-align:right; white-space:nowrap}
/* media coverage */
.media{padding:20px 22px; border-radius:var(--r-lg)}
.media .mh{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.mlist{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:6px; counter-reset:m}
.mlist a{display:grid; grid-template-columns:minmax(0,1fr) 18px; grid-template-areas:"src ext" "tt ext"; column-gap:12px; padding:11px 14px; border-radius:14px; background:var(--glass-3); border:1px solid var(--edge-2); color:inherit; text-decoration:none; transition:transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease}
.mlist a:hover{transform:translateX(3px); background:var(--glass-2); border-color:var(--accent-soft)}
.mlist .src{grid-area:src; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}
.mlist .tt{grid-area:tt; font-size:14.5px; font-weight:500; line-height:1.4; margin-top:2px; color:var(--ink)}
.mlist a:hover .tt{text-decoration:underline; text-decoration-color:var(--accent); text-underline-offset:3px}
.mlist .ext{grid-area:ext; align-self:center; color:var(--muted)}
.mlist .ext svg{width:16px; height:16px}
.mlist li.hidden-more{display:none}
/* financials */
.ftag{display:block; font-size:11.5px; color:var(--muted); font-weight:400}
.segrow .chev{display:inline-block; width:7px; height:7px; margin:0 10px 2px 2px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(-45deg); transition:transform 200ms var(--ease-out); vertical-align:middle}
.segrow.open .chev{transform:rotate(45deg)}
.segrow.open td{font-weight:600}
.segx td{padding:4px 0 12px !important; background:none}
.seglist{display:grid; gap:2px; padding:6px; border-radius:14px; background:var(--glass-3); border:1px solid var(--edge-2); max-height:340px; overflow:auto; animation:segIn 260ms var(--ease-out)}
@keyframes segIn{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
.seglist button{appearance:none; border:0; background:none; font:inherit; color:inherit; display:flex; justify-content:space-between; gap:12px; text-align:left; padding:8px 10px; border-radius:10px; cursor:pointer}
.seglist button:hover{background:var(--glass-2)}
.seglist .n{font-size:13.5px; font-weight:500; min-width:0}
.seglist small{display:block; font-size:11.5px; color:var(--muted); font-weight:400}
.seglist .a{text-align:right; font-size:13.5px; font-weight:600; white-space:nowrap}
@media (max-width:640px){ .lev-k{grid-template-columns:1fr 1fr} .lev-eq .arr{width:30px} }
.opb{font-style:normal; display:inline-block; margin-right:8px; padding:1px 7px; border-radius:6px; background:var(--tr); color:#fff; font-size:10px; letter-spacing:.06em}
.otags{display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:3px}
.oped .mlist{margin-top:0}

/* boot + data updates */
html.booting main{opacity:0}
html.booting body::after{content:""; position:fixed; left:50%; top:46%; width:34px; height:34px; margin:-17px; border-radius:50%; border:3px solid var(--hair-2); border-top-color:var(--accent); animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{transition:opacity .35s ease}
.updbtn span{font-size:13.5px}
@media (max-width:760px){ .updbtn span{display:none} }
.upd .drop{display:grid; justify-items:center; gap:6px; padding:30px 20px; border-radius:var(--r-lg); border:1.5px dashed var(--hair-2); cursor:pointer; text-align:center; transition:border-color .2s ease, background-color .2s ease, transform .2s var(--ease-out)}
.upd .drop:hover, .upd .drop.over{border-color:var(--accent); background:var(--accent-soft); transform:translateY(-1px)}
.upd .drop svg{width:30px; height:30px; color:var(--accent)}
.upd .drop b{font-size:16px}
.upd .drop span{font-size:13px; color:var(--muted)}
.ucards{display:grid; gap:12px}
.ucard{padding:16px 18px; border-radius:var(--r-md); display:grid; gap:8px}
.ucard .uh{display:flex; justify-content:space-between; align-items:center; gap:10px}
.ucard .cur{font-size:14px}
.ucard .src{color:var(--ink); font-weight:500}
.ucard .hint{font-size:12.5px; color:var(--muted)}
.ucard .fname{font-weight:600; font-size:14.5px; word-break:break-all}
.usum{margin:0; padding-left:18px; display:grid; gap:4px; font-size:13.5px; color:var(--ink-2)}
.uerr{font-size:13px; color:var(--accent); background:var(--accent-soft); padding:8px 12px; border-radius:10px}
.uwarn{font-size:12.5px; color:var(--over-ink); background:color-mix(in oklab,var(--over) 14%,transparent); padding:8px 12px; border-radius:10px}
.linkbtn{appearance:none; border:0; background:none; padding:0; font:inherit; font-size:13px; color:var(--tr); cursor:pointer; justify-self:start; text-decoration:underline; text-underline-offset:3px}
.linkbtn:disabled{opacity:.6; cursor:default}
.uact{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; bottom:0; margin:0 calc(-1 * clamp(16px,3vw,32px)) -32px; padding:14px clamp(16px,3vw,32px) 20px; background:color-mix(in oklab,var(--bg) 90%,transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--hair)}
.umsg{font-size:13px; color:var(--muted); max-width:46ch}
.gbtn:disabled{opacity:.5; cursor:not-allowed}
.newbar{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:60; display:flex; align-items:center; gap:14px; padding:10px 12px 10px 18px; border-radius:16px; font-size:14px; animation:segIn .3s var(--ease-out)}
</style>

// Al Fakhoora data engine: reads the three workbooks and assembles the dashboard data.
// Runs in the browser (window.XLSX) and in node (require('xlsx')) for testing.
const AFX = (() => {
'use strict';
const X = () => (typeof XLSX !== 'undefined' ? XLSX : null);

// ------------------------------------------------------------------ cells
function sheet(wb, re){ const n = wb.SheetNames.find(s => re.test(s.trim())); return n ? wb.Sheets[n] : null; }
function ref(ws){ const r = X().utils.decode_range(ws['!ref'] || 'A1:A1'); return {rows: r.e.r + 1, cols: r.e.c + 1}; }
const serialIso = n => { const d = new Date(Math.round((n - 25569) * 86400000)); return d.toISOString().slice(0, 10); };
function cv(ws, r, c){
  const cell = ws[X().utils.encode_cell({r: r - 1, c: c - 1})];
  if (!cell || cell.v == null || cell.v === '') return null;
  if (cell.t === 'd') { const d = cell.v instanceof Date ? cell.v : new Date(cell.v); return {d: new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10)}; }
  if (cell.t === 'n' && cell.z && X().SSF.is_date(cell.z)) return {d: serialIso(cell.v)};
  if (cell.t === 'b') return cell.v ? 'TRUE' : 'FALSE';
  if (cell.t === 'e') return null;
  return cell.v;
}
const r2 = x => Math.round(x * 100) / 100;
const iso = v => (v && typeof v === 'object' && v.d) ? v.d : null;
function num(v){
  if (v == null || (typeof v === 'object')) return null;
  if (typeof v === 'number') return r2(v);
  const s = String(v).replace(/ /g, '').replace(/\$/g, '').replace(/,/g, '').trim();
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return r2(parseFloat(s));
}
function txt(v){
  if (v == null) return '';
  if (typeof v === 'object') return v.d || '';
  let s = String(v).replace(/\r\n?/g, "\n").replace(/ /g, ' ').replace(/ \u2014 /g, ': ').replace(/\u2014/g, '-').replace(/ \u2013 /g, ' to ').replace(/\u2013/g, '-').trim();
  s = s.replace(/[ \t]+/g, ' ').replace(/\n\s*\n+/g, '\n\n');
  return s;
}
const norm = s => String(s || '').toLowerCase().replace(/[\u2013\u2014\-\u2013\u2014/|:,.()&]+/g, ' ').replace(/\s+/g, ' ').trim();
const MONS = {jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12};
const pad = n => String(n).padStart(2, '0');
// free-text dates seen in the register: 21/1/2025, 30-11-2029, 30/07/2025, Oct 31 2024, 30 Sept 2015
function looseDate(s){
  s = String(s || '').replace(/ /g, ' ').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return s;
  if ((m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/))) return m[3] + '-' + pad(m[2]) + '-' + pad(m[1]);
  if ((m = s.match(/^([A-Za-z]{3,4})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})$/)) && MONS[m[1].toLowerCase()]) return m[3] + '-' + pad(MONS[m[1].toLowerCase()]) + '-' + pad(m[2]);
  if ((m = s.match(/^(\d{1,2})\s+([A-Za-z]{3,4})[a-z]*\.?\s+(\d{4})$/)) && MONS[m[2].toLowerCase()]) return m[3] + '-' + pad(MONS[m[2].toLowerCase()]) + '-' + pad(m[1]);
  return null;
}

// --------------------------------------------------------------- detect
function detect(wb){
  const names = wb.SheetNames.map(s => s.trim().toLowerCase());
  if (names.some(n => /master data/.test(n)) && names.some(n => /payment log/.test(n))) return 'fin';
  if (names.includes('active') && names.includes('closed')) return 'narr';
  if (names.some(n => /^20\d\d$/.test(n)) || names.some(n => /af house|fakhoora house/.test(n))) return 'qc';
  return null;
}

// --------------------------------------------------------- projects file
const NCOLS = [['name', /name of the project/i], ['type', /type of intervention/i], ['desc', /description/i], ['from', /^from$/i], ['to', /^to$/i],
  ['status', /closed\s*\/\s*active/i], ['budget', /total budget/i], ['eaa', /eaa contribution/i], ['partners', /partner\(s\)/i], ['pc', /partner contribution/i],
  ['country', /^country/i], ['target', /project target|direct beneficiaries|^target/i], ['demo', /demographic/i], ['update', /achievement/i], ['about', /^about/i], ['comments', /^comments?$/i]];
function headerMap(ws, rowGuess, firstRe){
  const {rows, cols} = ref(ws);
  for (let r = 1; r <= Math.min(rows, 8); r++) {
    const hs = []; for (let c = 1; c <= cols; c++) hs.push(txt(cv(ws, r, c)));
    if (!hs.some(h => firstRe.test(h))) continue;
    const map = {}; NCOLS.forEach(([k, re]) => { const i = hs.findIndex(h => re.test(h)); if (i >= 0) map[k] = i + 1; });
    if (map.desc && hs[map.desc] === '' && map.desc + 1 < (map.from || 99)) map.dur = map.desc + 1; // ExCom: unnamed duration column
    return {row: r, map, rows};
  }
  return null;
}
function parseProjects(wb){
  const out = {rows: [], warnings: []};
  const kinds = [['active', /^active$/i], ['closed', /^closed$/i], ['excom', /excom/i]];
  for (const [kind, re] of kinds) {
    const ws = sheet(wb, re);
    if (!ws) { out.warnings.push('Sheet "' + kind + '" not found'); continue; }
    const H = headerMap(ws, 1, /name of the project/i);
    if (!H) { out.warnings.push('No header row in ' + kind); continue; }
    const g = (r, k) => H.map[k] ? cv(ws, r, H.map[k]) : null;
    let last = null;
    for (let r = H.row + 1; r <= H.rows; r++) {
      const name = txt(g(r, 'name'));
      if (!name) continue;
      const type = txt(g(r, 'type')), desc = txt(g(r, 'desc'));
      if (!type && !desc) {
        // a sub-row under a multi-country programme, or a section label (ACTIVE / CLOSED)
        if (last && (num(g(r, 'budget')) != null || num(g(r, 'eaa')) != null)) {
          (last.breakdown = last.breakdown || []).push({country: txt(g(r, 'name')), budget: num(g(r, 'budget')), eaa: num(g(r, 'eaa')), partner: num(g(r, 'pc')), beneficiaries: num(g(r, 'target'))});
        }
        continue;
      }
      const raw = {kind, title: name, type, description: desc,
        fromRaw: g(r, 'from'), toRaw: g(r, 'to'), duration: txt(g(r, 'dur')), nstatus: txt(g(r, 'status')),
        budget: num(g(r, 'budget')), budgetRaw: txt(g(r, 'budget')), eaa: num(g(r, 'eaa')), eaaRaw: txt(g(r, 'eaa')),
        partners: txt(g(r, 'partners')), partnerContrib: num(g(r, 'pc')), country: txt(g(r, 'country')), target: txt(g(r, 'target')),
        demographic: txt(g(r, 'demo')), update: txt(g(r, 'update')), about: txt(g(r, 'about'))};
      raw.from = iso(raw.fromRaw) || txt(raw.fromRaw); raw.to = iso(raw.toRaw) || txt(raw.toRaw);
      delete raw.fromRaw; delete raw.toRaw;
      out.rows.push(raw); last = raw;
    }
  }
  if (!out.rows.length) out.warnings.push('No projects found');
  return out;
}

// ----------------------------------------------------------- finance file
const MCOLS = {name: /^project name$/i, country: /^country$/i, partner: /^partner$/i, status: /^status$/i, start: /^start date$/i, end: /^end date$/i, targets: /^targets$/i,
  budget: /^total budget$/i, eaa: /^eaa contribution$/i, expenditure: /^expenditure/i, transferred: /^transferred$/i, remainingObligated: /^remaining obligated$/i,
  nextInst: /^next installment$/i, nextDate: /^next installment date$/i, lastUpdate: /^last update$/i, detail: /^detail sheet$/i};
function parseFinance(wb){
  const out = {master: [], cards: {}, payments: [], cash: [], cashTotal: null, partnerSheets: {}, asOf: null, warnings: []};
  // master data
  const ms = sheet(wb, /master data/i);
  if (ms) {
    const {rows, cols} = ref(ms); let hr = 0, map = {};
    for (let r = 1; r <= 10 && !hr; r++) { const hs = []; for (let c = 1; c <= cols; c++) hs.push(txt(cv(ms, r, c))); if (hs.some(h => MCOLS.name.test(h))) { hr = r; Object.entries(MCOLS).forEach(([k, re]) => { const i = hs.findIndex(h => re.test(h)); if (i >= 0) map[k] = i + 1; }); } }
    if (!hr) out.warnings.push('Master Data header not found');
    for (let r = hr + 1; hr && r <= rows; r++) {
      const g = k => map[k] ? cv(ms, r, map[k]) : null, name = txt(g('name'));
      if (!name) continue;
      if (/^total/i.test(name)) break;
      out.master.push({row: r, name, country: txt(g('country')), partner: txt(g('partner')), status: txt(g('status')),
        start: iso(g('start')), end: iso(g('end')), targets: num(g('targets')), budget: num(g('budget')), eaa: num(g('eaa')) || 0,
        expenditure: num(g('expenditure')) || 0, transferred: num(g('transferred')) || 0, remainingObligated: num(g('remainingObligated')) || 0,
        nextInst: num(g('nextInst')) || 0, nextDate: iso(g('nextDate')), lastUpdate: iso(g('lastUpdate')), detail: txt(g('detail'))});
    }
  } else out.warnings.push('Master Data sheet not found');
  // project cards
  const pc = sheet(wb, /project cards/i);
  if (pc) {
    const maxr = ref(pc).rows, c2 = (r, c) => cv(pc, r, c);
    let r = 1;
    while (r <= maxr) {
      const title = c2(r, 2), status = txt(c2(r, 9));
      if (title && ['Active', 'Completed', 'Suspend', 'Terminated'].includes(status) && txt(c2(r + 1, 2)) === 'Country') {
        const card = {inst: [], exp: [], instTotalLabel: null};
        let k2 = r + 1;
        while (k2 <= maxr) {
          const a = c2(k2, 2);
          if (typeof a === 'string' && a.startsWith('Next installment')) break;
          if (k2 > r + 1 && ['Active', 'Completed', 'Suspend', 'Terminated'].includes(txt(c2(k2, 9))) && txt(c2(k2 + 1, 2)) === 'Country') { k2--; break; }
          if (txt(a) === '#') {
            let k = k2 + 1;
            while (k <= maxr && txt(c2(k, 2)) !== 'Total') {
              const v = [2, 3, 4, 5, 6, 7, 8].map(c => c2(k, c));
              if (v[0] != null) card.inst.push({n: typeof v[0] === 'number' ? v[0] : txt(v[0]), planned: num(v[1]), plannedDate: iso(v[2]) || (txt(v[2]) || null), received: num(v[3]), receivedDate: iso(v[4]), status: txt(v[5]), variance: num(v[6])});
              k++;
            }
            card.instTotalLabel = txt(c2(k, 7)); k2 = k;
          }
          if (txt(a) === 'Period') {
            let k = k2 + 1;
            while (k <= maxr && txt(c2(k, 2)) !== 'Total') { const v = [2, 3, 4].map(c => c2(k, c)); if (v[0] != null) card.exp.push({period: txt(v[0]), eaa: num(v[1]), partner: num(v[2])}); k++; }
            k2 = k;
          }
          k2++;
        }
        (out.cards[txt(title)] = out.cards[txt(title)] || []).push(card);
        r = k2;
      }
      r++;
    }
  }
  // payment log
  const pl = sheet(wb, /payment log/i);
  if (pl) {
    const {rows} = ref(pl); let hr = 0;
    for (let r = 1; r <= 10 && !hr; r++) if (txt(cv(pl, r, 2)) === 'Date') hr = r;
    for (let r = (hr || 5) + 1; r <= rows; r++) {
      const v = [2, 3, 4, 5, 6, 7, 8].map(c => cv(pl, r, c));
      if (/^total/i.test(txt(v[0]))) break;
      if (v[4] == null || num(v[4]) == null) continue;
      out.payments.push({date: iso(v[0]), partner: txt(v[1]), project: txt(v[2]), n: typeof v[3] === 'number' ? v[3] : txt(v[3]), amount: num(v[4]), status: txt(v[5]), note: txt(v[6])});
    }
  } else out.warnings.push('Payment Log sheet not found');
  // cash flow, table 1
  const cf = sheet(wb, /cash flow/i);
  if (cf) {
    const {rows} = ref(cf); let hr = 0;
    for (let r = 1; r <= 10 && !hr; r++) if (txt(cv(cf, r, 3)) === 'Project') hr = r;
    for (let r = (hr || 4) + 1; r <= rows; r++) {
      const v = []; for (let c = 2; c <= 16; c++) v.push(cv(cf, r, c));
      if (/^total$/i.test(txt(v[1]))) {
        out.cashTotal = {paidTo2026: num(v[2]), plan26: num(v[3]), act26: num(v[4]), plan27: num(v[6]), plan28: num(v[9]), plan29: num(v[10]), planTotal: num(v[11]), paidLive: num(v[12]), remaining: num(v[13])};
        break;
      }
      if (!txt(v[1])) continue;
      out.cash.push({name: txt(v[1]), paidTo2026: num(v[2]), plan26: num(v[3]), act26: num(v[4]), plan27: num(v[6]), act27: num(v[7]), plan28: num(v[9]), plan29: num(v[10]), planTotal: num(v[11]), paidLive: num(v[12]), remaining: num(v[13])});
    }
  } else out.warnings.push('Cash Flow sheet not found');
  // partner detail sheets (installments and reported spending)
  wb.SheetNames.forEach(n => {
    const ws = wb.Sheets[n]; if (!ws || !ws['!ref']) return;
    let hr = 0; for (let r = 1; r <= 12 && !hr; r++) if (txt(cv(ws, r, 1)) === 'Installment' && txt(cv(ws, r, 2)) === 'Planned') hr = r;
    if (!hr) return;
    const rows = ref(ws).rows, inst = [], exp = [];
    let r = hr + 1;
    for (; r <= rows && txt(cv(ws, r, 1)) !== 'Total'; r++) { const v = [1, 2, 3, 4, 5].map(c => cv(ws, r, c)); if (v[0] != null && v[1] != null) inst.push({n: typeof v[0] === 'number' ? v[0] : txt(v[0]), planned: num(v[1]), plannedDate: iso(v[2]), received: num(v[3]), receivedDate: iso(v[4])}); }
    for (; r <= rows; r++) if (txt(cv(ws, r, 2)) === 'EAA') { for (let k = r + 1; k <= rows && txt(cv(ws, k, 1)) !== 'Total' && cv(ws, k, 1) != null; k++) exp.push({period: txt(cv(ws, k, 1)), eaa: num(cv(ws, k, 2)), partner: num(cv(ws, k, 3))}); break; }
    out.partnerSheets[n.trim()] = {eaa: num(cv(ws, 2, 6)), start: iso(cv(ws, 1, 2)), inst, exp};
  });
  // report date
  const fs = sheet(wb, /fact sheet/i);
  if (fs) { const {rows, cols} = ref(fs); for (let r = 1; r <= Math.min(rows, 12) && !out.asOf; r++) for (let c = 1; c <= cols; c++) { const t = txt(cv(fs, r, c)), m = t.match(/report date:\s*(\d{1,2})-([A-Za-z]{3})-(\d{4})/i); if (m && MONS[m[2].toLowerCase()]) { out.asOf = m[3] + '-' + pad(MONS[m[2].toLowerCase()]) + '-' + pad(m[1]); break; } } }
  if (!out.asOf) out.asOf = out.master.map(m => m.lastUpdate).filter(Boolean).sort().pop() || null;
  if (!out.master.length) out.warnings.push('No finance lines found');
  return out;
}
