      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
      <b>Drop Excel files here</b><span>or select them from your computer</span></label>
    <div class="ucards">${KINDS.map(k => `<section class="ucard glass" data-k="${k}"><div class="uh"><span class="k">${LABEL[k]}</span>${staged[k] ? '<span class="pill active">Ready</span>' : ''}</div>
      <div class="ub">${staged[k] ? stagedHTML(k) : `<div class="cur">Now showing ${statusLine(k)}</div><div class="hint">${HINT[k]}</div>`}</div>
      ${STORE[k] && !staged[k] ? `<button type="button" class="linkbtn" data-revert="${k}">${STORE[k].prev ? 'Undo last upload (' + esc(STORE[k].prev.file) + ')' : 'Go back to the built-in data'}</button>` : ''}
      ${staged[k] ? `<button type="button" class="linkbtn" data-unstage="${k}">Remove this file</button>` : ''}</section>`).join('')}</div>
    <div class="uact"><span id="updMsg" class="umsg">${Object.keys(staged).length ? 'Check the summaries, then publish. Everyone sees the new figures on their next visit.' : ''}</span>
      <button type="button" class="gbtn solid" id="updGo"${Object.keys(staged).length && !Object.values(staged).some(x => x.errors.length) ? '' : ' disabled'}>Publish update</button></div>
  </div>`;
}
function stagedHTML(k){
  const s = staged[k];
  return `<div class="fname">${esc(s.file)}</div><ul class="usum">${s.summary.map(x => `<li>${x}</li>`).join('')}</ul>
    ${s.errors.length ? `<div class="uerr">${s.errors.map(esc).join('<br>')}</div>` : ''}${s.warnings.length ? `<div class="uwarn">${s.warnings.map(esc).join('<br>')}</div>` : ''}`;
}
function openPanel(){ window.AFAPP.openSheetHTML(panelHTML()); wirePanel(); }
function repaint(){ const sh = document.getElementById('sheet'); const top = sh.scrollTop; sh.innerHTML = panelHTML(); sh.scrollTop = top; wirePanel(); }
function wirePanel(){
  const sh = document.getElementById('sheet'), inp = sh.querySelector('#updFile'), drop = sh.querySelector('#updDrop');
  inp.addEventListener('change', () => take([...inp.files]));
  ['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', ev => take([...ev.dataTransfer.files]));
  sh.querySelectorAll('[data-unstage]').forEach(b => b.addEventListener('click', () => { delete staged[b.dataset.unstage]; repaint(); }));
  sh.querySelectorAll('[data-revert]').forEach(b => b.addEventListener('click', async () => {
    const k = b.dataset.revert; if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Click again to confirm'; return; }
    b.disabled = true; b.textContent = 'Working…';
    try { await revertKind(k); window.AFAPP.toast('Done. Reloading with the restored data…'); setTimeout(() => location.reload(), 900); }
    catch (e) { window.AFAPP.toast('Could not change the data: ' + (e.code || e.message)); repaint(); }
  }));
  sh.querySelector('#updGo').addEventListener('click', publish);
}
let xlsxP = null;
function loadXLSX(){ if (window.XLSX) return Promise.resolve(); return xlsxP || (xlsxP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload = res; s.onerror = () => { xlsxP = null; rej(new Error('Could not load the Excel reader')); }; document.head.appendChild(s); })); }
async function take(files){
  files = files.filter(f => /\.xls[xm]$/i.test(f.name));
  if (!files.length) { window.AFAPP.toast('Only Excel files (.xlsx) can be uploaded'); return; }
  const msg = document.getElementById('updMsg'); if (msg) msg.textContent = 'Reading ' + files.length + ' file' + (files.length > 1 ? 's' : '') + '…';
  try { await loadXLSX(); } catch (e) { window.AFAPP.toast(e.message); return; }
  for (const f of files) {
    try {
      const wb = AFX.read(await f.arrayBuffer());
      const k = AFX.detect(wb);
      if (!k) { window.AFAPP.toast(f.name + ' does not match any of the three workbooks'); continue; }
      const piece = k === 'narr' ? AFX.parseProjects(wb) : k === 'fin' ? AFX.parseFinance(wb) : AFX.parseQC(wb);
      staged[k] = Object.assign({file: f.name, piece}, review(k, piece));
    } catch (e) { console.error(e); window.AFAPP.toast('Could not read ' + f.name + ': ' + e.message); }
  }
  repaint();
}
// what changes if this file is published
function review(k, piece){
  const errors = [], warnings = (piece.warnings || []).slice(), summary = [];
  const trial = Object.assign({}, PIECES, Object.fromEntries(Object.entries(staged).map(([kk, v]) => [kk, v.piece])), {[k]: piece});
  let R;
  try { R = AFA.assemble(AF_BASE, trial, TODAY); } catch (e) { errors.push('The dashboard could not be built from this file: ' + e.message); return {errors, warnings, summary}; }
  const oldP = Object.fromEntries(DATA.projects.map(p => [p.id, p])), newP = Object.fromEntries(R.DATA.projects.map(p => [p.id, p]));
  if (k === 'narr') {
    const c = s => R.DATA.projects.filter(p => !p.financeOnly && s.includes(p.status)).length;
    if (!piece.rows.length) errors.push('No projects were found in this file.');
    summary.push(`<b>${piece.rows.length}</b> projects: ${c(['active', 'suspended'])} active, ${c(['closed', 'terminated'])} closed, ${c(['pipeline'])} ExCom approved`);
    const added = R.DATA.projects.filter(p => !oldP[p.id] && !p.financeOnly), gone = DATA.projects.filter(p => !newP[p.id] && !p.financeOnly);
    const moved = R.DATA.projects.filter(p => oldP[p.id] && oldP[p.id].status !== p.status);
    const upd = R.DATA.projects.filter(p => oldP[p.id] && oldP[p.id].update !== p.update);
    if (added.length) summary.push('New: ' + added.map(p => esc(p.short)).join(', '));
    if (gone.length) summary.push('No longer in the file: ' + gone.map(p => esc(p.short)).join(', '));
    if (moved.length) summary.push('Status changed: ' + moved.map(p => esc(p.short) + ' (' + oldP[p.id].status + ' to ' + p.status + ')').join(', '));
    summary.push(upd.length ? upd.length + ' updated achievement texts' : 'Achievement texts unchanged');
  }
  if (k === 'fin') {
    if (!piece.master.length) errors.push('No finance lines were found in Master Data.');
    if (!piece.cashTotal) warnings.push('The Cash Flow total row was not found.');
    const T = R.DATA.totals;
    summary.push(`<b>${T.masterCount}</b> finance lines, ${T.activeCount} active · report date ${esc(piece.asOf || 'not found')}`);
    summary.push(`Active EAA ${usd(T.active.eaa)} · transferred ${usd(T.active.transferred)}` + (Math.abs(T.active.transferred - DATA.totals.active.transferred) > 1 ? ` (was ${usd(DATA.totals.active.transferred)})` : ''));
    summary.push(`${piece.payments.length} payments logged, ${usd(T.paymentLogTotal)}`);
    const loose = R.DATA.projects.filter(p => p.financeOnly && !oldP[p.id]);
    if (loose.length) warnings.push('Finance lines with no matching project in the projects workbook, shown as their own projects: ' + loose.map(p => p.short).join(', '));
  }
  if (k === 'qc') {
    const ys = Object.keys(piece.years), hs = Object.keys(piece.afh);
    if (!ys.length && !hs.length) errors.push('No year sheets or AF House sheet were found.');
    ys.forEach(y => { const L = piece.years[y]; summary.push(`<b>${y}</b>: ${L.length} activities, ${int(L.reduce((s, a) => s + (a.n || 0), 0))} attendances (replaces ${y})`); });
    hs.forEach(y => summary.push(`<b>AF House ${y}</b>: ${piece.afh[y].length} activities (replaces ${y})`));
    summary.push(`All years together: ${int(R.QC.QC_TOT.acts)} activities, ${int(R.QC.QC_TOT.att)} attendances`);
  }
  return {errors, warnings, summary};
}
async function publish(){
  const go = document.getElementById('updGo'), msg = document.getElementById('updMsg');
  go.disabled = true; go.textContent = 'Publishing…';
  let by = ''; try { by = user ? (await user.id()) || '' : ''; } catch (e) {}
  try {
    for (const [k, s] of Object.entries(staged)) { if (msg) msg.textContent = 'Saving ' + LABEL[k].toLowerCase() + '…'; await writeKind(k, s.piece, s.file, by); }
    staged = {};
    if (msg) msg.textContent = 'Published. Reloading…';
    window.AFAPP.toast('Update published');
    setTimeout(() => location.reload(), 900);
  } catch (e) {
    console.error(e);
    go.disabled = false; go.textContent = 'Publish update';
    const why = e && e.code === 'invalid_argument' ? 'Your sharing level does not allow changing the data.' : e && e.code === 'quota_exceeded' ? 'The data store is full.' : 'Please try again.';
    if (msg) msg.textContent = 'Publishing failed. ' + why;
  }
}
})();
