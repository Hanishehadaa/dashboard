 Scholars\n6 Palestinian","about":"The University of Oxford, the world's top-ranked university, has committed to supporting Palestinian and displaced scholars through this partnership. Oxford's global prestige and its Sanctuary Scholars initiative position this programme as one of the most prestigious refugee scholarship schemes in the world.","from":"2025-05-07","to":"2027-12-31"},{"kind":"active","title":"Qatar Scholarship Qatar","type":"Scholarship","description":"The Qatar Scholarship Program in Qatar is designed to support long-term residents of Qatar who face financial barriers preventing them from completing their higher education. By enabling these students to continue their academic journeys, the program empowers them to contribute positively to their communities and play an active role in advancing Qatar’s development goals, aligned with Qatar Vision 2030.\n\nLaunched in 2018 with generous funding from the Minister of Endowments (Awqaf) and Islamic Affairs. The program is implemented in partnership with universities across Qatar.","duration":"","nstatus":"Active","budget":27090710.67,"budgetRaw":"27090710.6712329","eaa":12844135.49,"eaaRaw":"12844135.4931507","partners":"Partner Universities in Qatar: Qatar University, University of Doha for Science & Technology, Qatar Foundation to Northwestern University, Qatar Foundation to Texas A&M, Qatar Foundation to Virginia Commonwealth, Qatar Foundation to Weill Cornell, Hamad Bin Khalifa University, Al Rayyan International University College, Qatar Finance & Business Academy, Oryx College University with Liverpool, Doha Institute for Graduate Studies, Global Studies Institute, Lusail University\n\nMinistry of Endowments (Awqaf) and Islamic Affairs","partnerContrib":17808219.18,"country":"Qatar","target":"400","demographic":"Marginalized expatriate youth residing in Qatar","update":"as of Q2 2026:\n\nAWQAF (not including PAL 100)\n435 scholarships awarded \n127 graduates \n281 enrolled\n\nOther\nTECH4Her - 3 scholarships awarded - 1 active, 2 grad\nMcDonalds - 2 scholarships awarded - 1 active, 1 Withdrawn\nSonunu - 3 scholarships awarded - 3 active (including 1 from Thumama","about":"NA","from":"2018-10-01","to":"2028-12-01"},{"kind":"active","title":"Qatar Scholarship in Qatar - Higher Education Scholarships for Gazan youth to study in Qatar","type":"Scholarship","description":"In December 2023, Education Above All through Al Fakhoora launched the 100 Scholarships Program for Gaza students who have had their education interrupted due to the recent conflict to continue and complete their studies in Qatar. The program aims to mitigate the adverse effects of the war on their academic pursuits, ensuring that they can continue their education despite their challenging circumstances. \n\nEAA is collaborating with the Ministry of Foreign Affairs, Awqaf, and leading universities in Qatar on this critical initiative. Through strategic partnerships and ongoing support, this initiative seeks to transform lives and contribute to the future development of Gaza Strip.","duration":"","nstatus":"Active","budget":6772677,"budgetRaw":"6772677","eaa":3211033,"eaaRaw":"3211033","partners":"Partner Universities in Qatar: Qatar University, University of Doha for Science & Technology, Hamad Bin Khalifa University, Oryx College University with Liverpool, Lusail University\n\nMinistry of Endowments (Awqaf) and Islamic Affairs","partnerContrib":2747752,"country":"Qatar","target":"100","demographic":"Youth from Gaza residing in Qatar","update":"As of Q2 2026\n105 awarded\n94 Active\n2 Graduated\n5 dismissed \n4 withdrawn","about":"NA","from":"2024-01-01","to":"2029-12-01"},{"kind":"active","title":"Afghan Girls Thrive - A partnership between Education Above All, Coursera, and Alight","type":"Skills to Employment","description":"This initiative aims to bridge the skills gap among Afghan women and girls worldwide through a large-scale online upskilling programme designed in partnership with Coursera and Alight. The project will provide 120,000 Afghan female adolescents, youth, and adults with access to flexible online learning opportunities that support dignified livelihoods, further education, and improved employability. Recognizing the diverse educational backgrounds of beneficiaries, the programme will offer courses in language, digital literacy, business, career readiness, and other essential skills, while also enabling access to selected Coursera content fully translated into Dari and Pashto. By combining accessibility, flexibility, and market-relevant learning pathways, the initiative will allow participants to tailor their educational journeys to their individual goals and the demands of the global labour market.","duration":"","nstatus":"Active","budget":850000,"budgetRaw":"850000","eaa":850000,"eaaRaw":"850000","partners":"Coursera for Government\n\nAlight","partnerContrib":0,"country":"Afghanistan, Pakistan, the Middle East, Africa, and other parts of the world","target":"120000","demographic":"Female Afghan women and youth, inside and outside Afghanistan","update":"","about":"Coursera is a global online learning platform launched in 2012 with a mission to expand access to world-class learning. Working with more than 375 university and industry partners, Coursera offers flexible, affordable, and job-relevant learning opportunities, including courses, professional certificates, and degrees, helping learners and institutions build skills for education, employment, and career advancement.\n\nAlight (formerly American Refugee Committee) is one of the world's leading humanitarian organizations, operating in 43 countries with deep expertise in Afghan refugee programming. Their networks in Indonesia and understanding of Afghan community needs make them an ideal partner for placing Afghan women in Indonesian universities.","from":"2024-06-01","to":"2027-10-01"},{"kind":"active","title":"Qatar Scholarship for Afghans, Education Above All Foundation and Alight","type":"Scholarship","description":"This scholarship programme is designed to expand access to tertiary education for 50 Afghan youth by supporting enrolment in two- and four-year undergraduate programmes at Indonesian universities. The initiative represents a strategic investment in the younger generation of Afghans, with a particular emphasis on strengthening their preparedness and enabling them to contribute meaningfully to their country and communities. The scholarship responds to a context in which Afghan youth continue to face major barriers to education and employment.","duration":"","nstatus":"Susupended","budget":3632840,"budgetRaw":"3632840","eaa":2403273,"eaaRaw":"2403273","partners":"Universities in Indonesia \nAlight","partnerContrib":1229567,"country":"Indonesia","target":"50","demographic":"Afghanistan youth who will study in Indonesia and return to Afghanistan","update":"","about":"Alight (formerly American Refugee Committee) is one of the world's leading humanitarian organizations, operating in 43 countries with deep expertise in Afghan refugee programming. Their networks in Indonesia and understanding of Afghan community needs make them an ideal partner for placing Afghan women in Indonesian universities.","from":"2024-11-12","to":"2028-11-11"},{"kind":"active","title":"Education Above All-Qatar Scholarship in Qatar for World Cup Volunteers","type":"Scholarship","description":"This project provides scholarships for up to 12 talented students from the MENA region who volunteered with Qatar Red Crescent during the World Cup. The program aims to ensure that they can continue their education despite the challenging circumstances.\n\nThe Programme was established in 2024 with generous funding from Qatar Fund for Development (QFFD), and is currently being implemented in collaboration with two partner universities, University of Doha for Sciences & Technology in Qatar UDST and UCSI University in Malaysia.","duration":"","nstatus":"Active","budget":1812022,"budgetRaw":"1812022","eaa":null,"eaaRaw":"","partners":"QFFD","partnerContrib":1812022,"country":"Qatar, Malaysia","target":"12","demographic":"Yemen (4 - 3 males, 1 female)\nIraq (3 males)\nSyria (5 males)","update":"As of Q2 2026\n9 students enrolled (7 UDST, 2 UCSI Malaysia) (3 Syria, 3 Iraq, 3 Yemen)\n\n1 graduated\n7 active\n1 on hold","about":"Implementing Partner: Education Above All Foundation\n\nMain Funding Partner: Qatar Fund for Development\n\nPartner Universities: University of Doha for Science & Technology, UCSI University (Malaysia)","from":"2024-09-01","to":"2029-09-01"},{"kind":"active","title":"Qatar Scholarship - Education Above All Foundation/ Birzeit University: Phase 2","type":"Scholarship","description":"Expanding the successful partnership between Education Above All Foundation and Birzeit University, Phase 2 of this project will provide access to high-quality programmes of study to 1,966 deserving, eligible Palestinian youth to complete their education at the prestigious Birzeit University. The students benefiting from this scholarship are diverse, from different academic disciplines and levels of study. The scholarship is open to students registered with the Ministry of Social Affairs, academically outstanding students, and people with special needs.","duration":"","nstatus":"Acitve","budget":20000000,"budgetRaw":"20000000","eaa":10000000,"eaaRaw":"10000000","partners":"Birzeit University\nQFFD","partnerContrib":10000000,"country":"Palestine","target":"1966","demographic":"Palestinian youth - marginalized and those exhibiting academic excellence","update":"as of Q2 2025 \n1020 awarded and active","about":"With the school established in 1924 and the university founded in 1972, Birzeit University offers 131 academic programs in 9 colleges (Business & Economics, Arts, Law and Public Administration, Education, Pharmacy, Nursing, and Health Professions, Postgraduate Studies & Research, Art, Music & Design, and Science). Since its inception, the university has developed in response to the increasing demands of higher education in Palestine and the world. Against all odds, including severe restrictions on academic development and freedom imposed by occupation, the university embodies a success story that is inspiring to all Palestinians","from":"2025-04-23","to":"30-11-2029"},{"kind":"active","title":"Rebuilding Hope for Gaza: Emergncy Support for High School Exam (Tawjihi) for Gaza Students","type":"Emergency & Crisis Response","description":"The “Rebuilding Hope for Gaza: Emergency Support for High School Exam (Tawjihi) for Gaza Students” project aims to ensure the continuity of education for 120,000 high school students in Gaza through the successful administration of electronic General Secondary Examinations (Tawjihi). In partnership with the Ministry of Education (MoE) and UNDP, the project will establish 100 fully equipped educational centers, providing reliable internet, stable power, and secure digital exam platforms.\n\nThe project will distribute 10,000 tablets to students to enable secure online examinations, ensuring access despite infrastructure collapse. Structured academic support will reach 30,000 students through remedial courses, mock exams, and orientation sessions, as well as psychosocial support services to enhance resilience and mental well-being.","duration":"","nstatus":"Active","budget":3888000,"budgetRaw":"3888000","eaa":2716200,"eaaRaw":"2716200","partners":"UNDP","partnerContrib":1171800,"country":"Palestine","target":"120000","demographic":"Palestinian youth in residing in Gaza","update":"NCE signed in July 2026\n\nQ3 2026 Achievements: \n\n11 schools / compromised the 110 Temporary Learning Spaces \n\nenabling a total of 95,179 students to sit for their Tawjihi examinations","about":"The United Nations Development Programme’s Programme of Assistance to the Palestinian People (UNDP/PAPP) works in partnership with Palestinian institutions, civil society, and donors to support resilience, recovery, and sustainable development in Palestine, with a strong focus on Gaza. UNDP/PAPP supports critical areas including early recovery, livelihoods, infrastructure, governance, and essential services, helping vulnerable communities strengthen their resilience and rebuild their futures.","from":"2025-05-28","to":"2027-07-30"},{"kind":"active","title":"Qatar Scholarship - Education Above All Foundation / Doha Institute for Graduate Studies","type":"Scholarship","description":"Through Al Fakhoora's Qatar Scholarship Programme in Qatar, Education Above All Foundation (EAA) and the Doha Institute for Graduate Studies (DI) are partnering to expand access to master's-level education for eligible youth. The programme supports students from international backgrounds who have been admitted to DI and meet the scholarship's academic and eligibility criteria. Scholarship fields are selected in line with future labour-market needs, while students also benefit from Qatar Connection activities, employability-focused training, workshops, and regular engagement with EAA. \n\nFor the 2025/2026 academic year, seven international students were selected across Development Economics, Public Policy, Public Administration, and Journalism.","duration":"","nstatus":"Active","budget":null,"budgetRaw":"","eaa":null,"eaaRaw":"QAR 376,500","partners":"Doha Institute","partnerContrib":null,"country":"Qatar","target":"10","demographic":"International Students studying in Doha","update":"7 scholarships awarded in Jan 2026\n\n7 females - Palestine (3), Tunisia (2), Algeria (1), Syria (1) \n\nas of Q2 - 2026\n\n7 scholarships awarded\n7 active","about":"The Doha Institute for Graduate Studies was founded in Qatar in 2015 as a Doha-based independent institution of higher education. The Institute offers MA and PhD programs in two schools: the School of Social Sciences and Humanities and the School of Economics, Administration and Public Policy. The Institute adopts a student-centered approach to learning, promotes interdisciplinary research, and uses Arabic as the primary language of instruction, with fluency in English a requirement.","from":"Signed in 2025","to":"through 2027"},{"kind":"closed","title":"Gaza Higher Education, Rehabilitation & Emergency Support Programme","type":"Emergency & Crisis Response","description":"A multi-phase programme delivering physical reconstruction, institutional upgrading, disability-inclusive services, and emergency humanitarian support across Gaza. Implemented across four interconnected components spanning higher education infrastructure, rehabilitation, inclusive services, and urgent medical relief.\n\nThis multi-project intervention included the construction of IUG roof floors, rehabilitation of 5+ universities, psychosocial support for 52,748 disabled youth, and emergency medical supply to Gaza hospitals serving 1.8M residents.","duration":"","nstatus":"Closed","budget":14127590,"budgetRaw":"14127590","eaa":6813795,"eaaRaw":"6813795","partners":"QRC","partnerContrib":7313795,"country":"Palestine","target":"144078","demographic":"","update":"Components\n1. Construction: Islamic University of Gaza\nConstruction of two roof floors for the Faculties of Medicine and Science, directly benefiting ~1,330 undergraduate students and providing new ICT facilities and lecture halls accessible to over 20,000 registered IUG students.\n2. Rehabilitation & Upgrading of Higher Education Institutions\nReconstruction, maintenance, and upgrading of multiple universities across Gaza, including Al Azhar University, Al Quds Open University, IUG, UCAS, and the College of Science and Technology: Khan Younis. Key outputs included new engineering and IT labs, an innovative lab, an electronic lab, a conference hall, and a new campus center. Total beneficiaries: ~50,000.\n3. Psychosocial Support, Disability Services & Vocational Training\nComprehensive disability-inclusive programming covering hospital rehabilitation infrastructure, psychosocial support for children and youth, hearing and visual impairment screening, vocational training, small business grants, and job creation for disabled youth. Total beneficiaries: 52,748.\n4. Emergency Medical Supply\nUrgent provision of medicines, medical disposables, and ambulance consumables to Ministry of Health hospitals and the Palestinian Red Crescent across Gaza. The component ensured continuity of surgical and emergency services for ~1.8 million residents during and after the war, contributing directly to saving hundreds of lives. Total beneficiaries: 40,000 direct / 1.8M indirect.","about":"","from":"2010-10-06","to":"30 Sept 2015"},{"kind":"closed","title":"Youth Empowerment through Vocational Training and Income Generation Projects","type":"Skills to Employment","description":"This project involved 100 marginalized youth, of which 20% were identified as having pecial needs. Given the gender equity issue, special attention has indeed been given to this issue in this project, of which 43 are female trainees.","duration":"","nstatus":"Closed","budget":630075,"budgetRaw":"$ 630,075","eaa":315037,"eaaRaw":"$ 315,037","partners":"IRW: Islamic Relief Worldwide","partnerContrib":315038,"country":"Palestine","target":"100","demographic":"Palestinian Youth","update":"The target group received intensive vocational training in 8 courses selected based on candidates’ interests. Selected courses included Cell phones maintenance, Computer maintenance, Sewing and Embroidery, Cooking & Food processing, Autotronics, Computer programming, Web & Multimedia design, photography and video. To advance their theoretical perspectives, the trainees benefited from managerial training in topics related to how to set up new businesses. Afterwards, 53 trainees has been provided with the opportunity to set up their own business, whereas the remaining 47 trainees have been provided with temporary employment for 6 months.","about":"","from":"2011-09-13","to":"2012-11-12"},{"kind":"closed","title":"Support for the Education System in Iraq","type":"Emergency & Crisis Response","description":"This project centered on delivering a sustainable programme aimed at providing a quality education overarching continuum of learning delivery from primary to higher education in the areas of curriculum, higher education, literacy and teacher training.","duration":"","nstatus":"Closed","budget":18684752,"budgetRaw":"$ 18,684,752","eaa":18684752,"eaaRaw":"$ 18,684,752","partners":"UNESCO","partnerContrib":0,"country":"Iraq","target":"819276","demographic":"NA","update":"Developing new Curriculum: Grades 1-6 math and science new curriculum completed, 570 math and science curriculum specialists trained; 680 teachers trained \n\nRehabilitation Iraqi Higher Education System: 273 Ministry of Higher Education Science & Research (MoHESR) university managers and staff trained, 55 MoHESR senior staff and high level managers trained on the Quality Assurance framework and policy development\n\nTeacher Education and Training: 17,698 teachers & 782 master and teacher trainers and specialist trained (782 not included in total number of beneficiaries because of duplication)\n\nLiteracy Initiative for Empowerment: 800,000 literate learners completed literacy programmes and 10,814 vulnerable illiterates enrolled in literacy and life program. (10,814 not included in total)","about":"UNESCO is the United Nations Educational, Scientific and Cultural Organization, a specialized United Nations agency dedicated to strengthening international cooperation in the fields of education, science, culture, communication, and information. Working with its Member States around the world, UNESCO develops standards, knowledge, and tools to advance quality education, safeguard cultural and natural heritage, promote access to reliable information, and support peace, equality, and sustainable development.","from":"2010-12-01","to":"2016-11-01"},{"kind":"closed","title":"Al Fakhoora Dynamic Futures Programme: Phases I & II Palestine","type":"Scholarship","description":"Dynamic Futures Gaza is Education Above All’s flagship 13-year scholarship programme, and the origin of Al Fakhoora. Al Fakhoora recognizes the resounding impact of higher education on youth, their families and the broader community. Our organization is the first of its kind to offer a unique, holistic scholarship programme comprised not only of access to higher education but also providing students with much needed student affairs and inspirational civic engagement. Through a multi-faceted approach, the Dynamic Futures Programme provides some of the most marginalized youth from conflict/ post-conflict regions with an opportunity to unlock their full potential, enabling them to play a key role in rebuilding their communities.","duration":"","nstatus":"Closed","budget":27300597,"budgetRaw":"27300597","eaa":22200778,"eaaRaw":"22200778","partners":"UNDP","partnerContrib":5099819,"country":"Palestine","target":"999","demographic":"Palestinian Youth","update":"From the beginning of the Programme, 999 students graduated from the programme\n• 999 students participated in student services activities including English skills and computer skills\n• 999 Students participated in civic engagement activities\n• 30 MA graduates from abroad (including UK).\n• 887 graduates participated in the internship opportunities","about":"The United Nations Development Programme’s Programme of Assistance to the Palestinian People (UNDP/PAPP) works in partnership with Palestinian institutions, civil society, and donors to support resilience, recovery, and sustainable development in Palestine, with a strong focus on Gaza. UNDP/PAPP supports critical areas including early recovery, livelihoods, infrastructure, governance, and essential services, helping vulnerable communities strengthen their resilience and rebuild their futures.","from":"2009-10-01","to":"2022-06-30"},{"kind":"closed","title":"Equipping and Maintaining UNRWA Schools","type":"Emergency & Crisis Response","description":"In response to the 2014 conflict in Gaza, in February 2015 Al Fakhoora partnered with the United Nations Relief and Works Agency (UNRWA) to perform vital maintenance and repair activities on 43 schools across Gaza.\n\nThe targeted schools were predominantly those previously used as designated shelters/collective centres during and after the 2014 hostilities, which sustained damages due to massive use by IDPs.","duration":"","nstatus":"Closed","budget":3462432,"budgetRaw":"$ 3,462,432","eaa":3462432,"eaaRaw":"$ 3,462,432","partners":"UNRWA","partnerContrib":0,"country":"Palestine","target":"86000","demographic":"UNRWA schools for Palestinian refugees","update":"• 86, 000 direct beneficiaries\n• 481, 600 indirect beneficiaries\n• 43 damaged schools refurbished\n• 1,075 classrooms refurbished\n• 77 water pumps provided\n• 44 WASH facilities refurbished\n• 10,075metre squared landscape relandscaped\n• 177 classrooms supplied with desks\n• 3,700 desks supplied \n• 31 generators supplied\n• 500 laptops and PC provided\n• 43 photocopiers provide \n• 43 printers supplied","about":"United Nations Relief and Works Agency (UNRWA) is a United Nations agency established in 1949 to provide assistance and protection to Palestine refugees across Jordan, Lebanon, Syria, the Gaza Strip, and the West Bank, including East Jerusalem. It delivers essential services in areas such as education, health care, relief and social services, emergency assistance, and human development, supporting Palestine refugee communities under challenging conditions.","from":"2015-03-01","to":"2019-02-28"},{"kind":"closed","title":"Investing in Education and Building Resilience","type":"Emergency & Crisis Response","description":"As a response to the 2014 conflict in Gaza, to positively contribute and restore the well-being and hope of children and caregivers throughout the Gaza strip, in February 2015 Al Fakhoora and the United Nations International Children’s Emergency Fund (UNICEF) signed the “Investing in Education and Building Resilience” project. Over 114,695 beneficiaries directly benefited from the various project interventions, including students, adolescents, teachers, mental health workers, school counsellors, and staff who benefitted or worked at the various Palestinian organizations and Ministries involved in the project.","duration":"","nstatus":"Closed","budget":4499154,"budgetRaw":"4499154","eaa":4499154,"eaaRaw":"4499154","partners":"UNICEF","partnerContrib":0,"country":"Palestine","target":"114695","demographic":"Palestinian Youth and Children","update":"• 102,000 direct student beneficiaries\n• 11,000 teachers trained in psychosocial, resilience strategies\n• 420 school counsellors trained on child protection & psychosocial support\n• One school Child Friendly School built\n• 40, 265 children benefited from psycho social support\n• 5 additional Child Protection Networks established - establishment and support including training 90 CPN members, establishment of central information systems for case management within MOSA network, and training of 391 professionals on child protection, detection of child abuse cases and referral to the CPNs\n• 1,288 students received civic engagement training\n• 1, 233 students designed and led initiatives \n• 7 specialised counselling units established\n• 25 play therapy rooms established\n75 school counselling spaces were refurbished inside schools\n• 300 art teachers trained\n• “Beautification” of the physical environment of 145 secondary schools through painting and art\n• 119 classrooms provided with education aids\n• 119 classrooms provided with sports equipment\n• 119 classrooms provided with furniture \n\nSpotlight: Jamal Abdul Nasser to The First Child-Friendly School in Palestine\n\nAl Fakhoora, in collaboration with UNICEF, UNDP and MoEHE, was able to introduce the first prototype of a state of the art school in Gaza, integrating CFS concepts in design and implementation. The school buildings at Jamal Abdul Nasser school are structurally stable, weatherproof according to local Gaza environmental conditions, climatically comfortable, easily exited in case of emergency, and well-integrated with the environmental and cultural context. The school serves as a prototype for child-friendly school design in Gaza, with the intention of prompting similar initiatives throughout Palestine.","about":"UNICEF is the United Nations agency for children, working in over 190 countries and territories to save children’s lives, defend their rights, and help them fulfil their potential from early childhood through adolescence. UNICEF supports children through programmes in education, child protection, health, nutrition, water and sanitation, and emergency response, working with partners to improve the wellbeing of children and families worldwide.","from":"2015-02-14","to":"2019-05-28"},{"kind":"closed","title":"Right To Education","type":"Emergency & Crisis Response","description":"In February 2015 Al Fakhoora and the United Nations Development Programme (UNDP) launched the “Right to Education Programme” to support the recovery of the educational sector in Gaza through reconstructing, rehabilitating and building back better 50 damaged and destroyed educational institutions, as a result of the 2014 hostilities on Gaza. \n\nThe aim of the Right to Education Programme was to ensure increased resiliency and improved wellbeing of Palestinian children and youth through better access to quality education, diversified livelihood opportunities, e-work, and mental health support interventions. It provided a unique opportunity to respond to the recovery of the education sector in a holistic manner, integrating emergency responses into sustainable and scalable development interventions.","duration":"","nstatus":"Closed","budget":20246162,"budgetRaw":"$ 20,246,162","eaa":20246162,"eaaRaw":"$ 20,246,162","partners":"UNDP","partnerContrib":0,"country":"Palestine","target":"98994","demographic":"Palestinian Youth and Children","update":"Main Achievements: \n\n- 98,994 direct beneficiaries \n- 600,000 indirect beneficiaries\n- 50 Educational facilities reconstruction and/or rehabilitated (22 govt schools, 13 private schools, 5 training centers, 10 colleges/universities)\n- 8 Multi-purpose halls \n- 7782 children received school trauma treatment \n- 5 water wells built\n- 424 School counsellors trained\n- 642 Mental Health Professionals trained\n\nBreakdown of achievements:\n- Reconstruction of 4 totally damaged schools, including furniture \n- Rehabilitation and expansion of 15 school extensions, with an additional 119 classrooms\n- Application of Child Friendly School Principles in two schools in Gaza, for the first time\n- 182 classrooms added in targeted governmental schools\n- 14,397 students benefited directly from recovery of public schools\n- Double shifts decreased from 66.8% in 2014-2015 to 58.1% in 2016-2017\n- Installation of 406 KW solar energy in one targeted school\n- Construction of 5 water wells and 5 small desalination plants \n- Construction of 8 Multi-Purpose Halls, to be used as Emergency Shelters\n- Construction of 7 WASH facilities, comprising 70 toilets\n- Rehabilitation of 13 damaged private schools\no Approximately 4,991 students have benefited from the targeted private schools \n- Rehabilitation of 5 training centres\n- Recovery of 10 higher education institution, serving 73,560 students \n- 21 university buildings recovered \n- 96 lecturing halls, 15 labs, 117 administration offices, and 55 toilets rehabilitated and renovated","about":"The United Nations Development Programme’s Programme of Assistance to the Palestinian People (UNDP/PAPP) works in partnership with Palestinian institutions, civil society, and donors to support resilience, recovery, and sustainable development in Palestine, with a strong focus on Gaza. UNDP/PAPP supports critical areas including early recovery, livelihoods, infrastructure, governance, and essential services, helping vulnerable communities strengthen their resilience and rebuild their futures.","from":"2015-02-15","to":"2018-06-30"},{"kind":"closed","title":"Dynamic Futures Programme - Syrian Refugees and Palestinian Expansion","type":"Scholarship","description":"This project, implemented in coordination with SPARK across six countries, expanded access to quality, relevant higher education opportunities for 6,345 deserving, capable, yet underserved Syrian refugees, Palestinian postsecondary students, and vulnerable youth from host communities. It is designed to build a cadre of civic-minded, intellectually able, and professionally skilled leaders who are equipped to make meaningful contributions within their communities and globally.","duration":"","nstatus":"Closed","budget":38908674.44,"budgetRaw":"38908674.436000004","eaa":11884772,"eaaRaw":"11884772.000000004","partners":"SPARK","partnerContrib":27023902.44,"country":"Turkey, Syria, Lebanon, Palestine (WB), Jordan, Iraq","target":"6345","demographic":"Palestinian and Syrian refugee youth, and marginalized youth from host countries","update":"•6,345 scholarships (44% female) have been awarded \n5,733 (45% female) students have successfully graduated from the programme (82%)\n•2,109 (48% female) students have received student services support (orientation sessions, remedial and summer courses, PSS and language support),\n•1,671 (50% female) students have participated in civic leadership training \n•1,737 (50% female) students have benefitted from the various economic empowerment activities (job skilling and entrepreneurship training, business plan development support and internships) \n\n5722 Grad: 1118 BA, 3902 TVET certificate, 702 TVET Diploma\n120 Enrolled: 104 BA, 16 TVET diploma\n503 dismissed/cancelled: 130 BA, 201 TVET Certificate, 172 TVET Diploma","about":"SPARK is an international organization that works to open pathways for young people, particularly women and refugees, to study, work, and grow their own businesses in fragile communities. With more than 25 years of experience, SPARK works closely with local partners, the private sector, and government actors to create enabling environments for education, entrepreneurship, and employment, helping young people rebuild their futures and contribute to economic growth and stability.","from":"2016-04-30","to":"2022-05-31","breakdown":[{"country":"Turkey","budget":13783674.59,"eaa":5700015.84,"partner":8083658.76,"beneficiaries":3070},{"country":"Jordan","budget":3411608.83,"eaa":65315.29,"partner":3346293.55,"beneficiaries":510},{"country":"KRG","budget":3987087.38,"eaa":0,"partner":3987087.38,"beneficiaries":180},{"country":"Lebanon","budget":14475812.02,"eaa":5037090.84,"partner":9438721.18,"beneficiaries":1635},{"country":"Syria","budget":2168141.56,"eaa":0,"partner":2168141.56,"beneficiaries":900},{"country":"Palestine","budget":1082350.04,"eaa":1082350.04,"partner":0,"beneficiaries":50}]},{"kind":"closed","title":"Qatar Scholarship to Education Above All Foundation / Luminus Technical University College","type":"Scholarship","description":"The Qatar Scholarship to EAA / Luminus Technical University College (LTUC) partnership will provide access to high quality education programmes of study, including diplomas, associate degrees, and bachelor degrees, for 941 deserving, capable yet underserved Syrian, Palestinian and Jordanian* vulnerable youth residing in Jordan. The scholarship will empower beneficiaries from historically underserved communities through a tested, technology driven, flexible delivery model focusing on recognized international qualifications to ensure wide access (including women) and potential for mobility.","duration":"","nstatus":"Closed","budget":13382778,"budgetRaw":"13382778","eaa":3466451,"eaaRaw":"3466451","partners":"Luminus Technical University College","partnerContrib":9916327,"country":"Jordan","target":"941","demographic":"50% refugees - 50% Jordanian nationals","update":"**LTUC - 941 \n\nActive+on-leave 316 + grad 619 grad = 935 + 6 open scholarships - awarded but not replaced at time of closing\n\n277 Associates degree\n50 Bachelor\n507 Higher National Diploma (HND5)\n107 Vocational Diploma","about":"Luminus Technical University College was established in 1980 under the name of Al Quds College and is part of Luminus Education Group. LTUC aims to offer unique programs based on identified market needs and employment requirements. The University College develops entrepreneurial and career training for students, equipping them for the real world and its economic challenges.","from":"2021-10-17","to":"2023-09-30"},{"kind":"closed","title":"Professional Certificate for Young Refugees supported by Qatar Scholarship to EAA & the Ruth Stanton Foundation - Phase 1","type":"Scholarship","description":"The Professional Certificate for Young Refugees, which is unique in France, is a two-year diploma designed for young refugees whose education has been abruptly interrupted. The diploma is accredited by the Ministry of Education in France, and aims to facilitate students’ integration and equip students to access opportunities for further advancement, whether it be continuing with higher education or entering the job market.","duration":"","nstatus":"Closed","budget":1351865,"budgetRaw":"1351865","eaa":675933,"eaaRaw":"675933","partners":"Sciences Po","partnerContrib":675932,"country":"France","target":"30","demographic":"Refugees and Asaylum seekers residing in France","update":"as of Q2 2024:\n30 scholarships awarded (4 youth - 26 adults)\n30 graduated","about":"Sciences Po’s overarching mission is to educate future leaders in the public and private sectors. Curious and open-minded, Sciences Po graduates, regardless of their focus and trajectory, all share the ability to “learn how to learn”, which is one of the priorities of our education. Sciences Po's international dimension was established in its founding documents. Driven by this vocation for nearly 150 years, today Sciences Po stands out as a world-class university, with internationally-recognized degrees and research, a multicultural community and a worldwide network of partners.","from":"2022-09-01","to":"2024-07-31"},{"kind":"closed","title":"Qatar Scholarship - Education Above All Foundation/ Birzeit University: Phase 1","type":"Scholarship","description":"The Qatar Scholarship - Education Above All Foundation/ Birzeit University partnership will provide access to high-quality programmes of study to 926 deserving, eligible Palestinian youth to complete their education at the prestigious Birzeit University.","duration":"","nstatus":"Closed","budget":1071431,"budgetRaw":"1071431","eaa":1071431,"eaaRaw":"1071431","partners":"Birzeit University\nQFFD","partnerContrib":null,"country":"Palestine","target":"926","demographic":"Palestinian youth","update":"As of Jan 2025\n926 awarded (M 344 - F 582)\n926 graduated\n\nAs of Jan-6-2-25: Pending Final Payment","about":"With the school established in 1924 and the university founded in 1972, Birzeit University offers 131 academic programs in 9 colleges (Business & Economics, Arts, Law and Public Administration, Education, Pharmacy, Nursing and Health Professions, Postgraduate Studies & Research, Art, Music & Design, and Science). Since its inception, the university has developed in response to the increasing demands of higher education in Palestine and the world. Against all odds, including severe restrictions on academic development and freedom imposed by occupation, the university embodies a success story that is inspiring to all Palestinians.","from":"2024-04-23","to":"Oct 31 2024"},{"kind":"closed","title":"Rebuilding Hope in Gaza: Hot Meals & Food Assistance for Displaced Children and Families","type":"Emergency & Crisis Response","description":"An emergency food assistance programme providing hot meals and ready-to-eat food packages to displaced children and families across the Gaza Strip during active conflict. Delivered across two phases, including a dedicated Ramadan component.","duration":"","nstatus":"Closed","budget":1028225,"budgetRaw":"1028225","eaa":363145,"eaaRaw":"363145","partners":"QRC","partnerContrib":665080,"country":"Palestine","target":"109500","demographic":"Displaced and conflict-affected persons in Gaza, particularly females","update":"Components\nPhase 1: Emergency Hot Meals & Food Packages\nDistribution of 97,500 hot meals and 97,500 ready-to-eat meal packages over 30 days, with 3,250 hot meals provided daily. Total beneficiaries: 104,500.\nPhase 2: Ramadan Food Assistance\nDistribution of 75,000 hot meals during Ramadan, targeting displaced families with time-sensitive nutritional support. Total beneficiaries: 5,000.","about":"Qatar Red Crescent Society (QRCS) is a Qatari humanitarian and charitable organization that works to improve the lives of vulnerable people through relief, recovery, health, and development programmes in Qatar and internationally. As an auxiliary to the State of Qatar in humanitarian efforts, QRCS works with partners and volunteers to deliver emergency assistance, health services, community support, and development interventions that help protect lives and preserve dignity.","from":"2024-01-01","to":"2024-04-30"},{"kind":"closed","title":"Rebuilding Hope for the Palestinians in the Gaza Strip\n(Dignity Kits and Youth-led Humanitarian Initiatives)","type":"Emergency & Crisis Response","description":"In response to the war in Gaza which commenced in October 2023, EAA has partnered with UNFPA to address the needs of youth and women and adolescent girls in Gaza. This joint project targets a total of 18,000 women and youth through a dedicated focus on distribution of 15,000 hygiene and dignity kits, along with 250 youth-led humanitarian initiatives involving 3,000 youth.","duration":"","nstatus":"Closed","budget":3000000,"budgetRaw":"3000000","eaa":1000000,"eaaRaw":"1000000","partners":"UNFPA","partnerContrib":2000000,"country":"Palestine","target":"18000","demographic":"Displaced and conflict-affected persons in Gaza, particularly females","update":"Final: \n\n17,550 Hygiene Kits distributed. \n264 community initiatives conducted, engaging 3,585 youth \n103,025 beneficiaries reache\n\nUNFPA Constructs Classrooms for Children in Central and Northern Gaza Strip\n6,500 beneficiaries reached through Kiswet El Eid initiative (shipped from Doha).","about":"The United Nations Population Fund (UNFPA) is the United Nations sexual and reproductive health agency, working in more than 150 countries and territories to uphold the rights and choices of women, girls, and young people. Through its work in areas such as sexual and reproductive health, maternal health, gender equality, and protection from gender-based violence and harmful practices, UNFPA supports partners to improve wellbeing, strengthen resilience, and help people realize their full potential.","from":"Signed in Dec 2023\nEffective date on Contract March 2024\n\nLetter of Award - Dec 2023\nAgreement Signed: February 2024","to":"2025-03-31"},{"kind":"closed","title":"Qatar Scholarship -Education Above All Foundation / American University of Beirut","type":"Scholarship","description":"The Qatar Scholarship to EAA / American University of Beirut partnership will provide access to high quality education programmes of study to 316 deserving, eligible Lebanese, Palestinian and Syrian young women and men, residing in Lebanon, at the US-accredited American University of Beirut, to pursue an undergraduate degrees. These project provides students with access to world-class education and transformative experiences that go beyond academics, and include civic engagement and leadership, targeted academic and psychosocial support, as well as career preparation and guidance.","duration":"","nstatus":"Closed","budget":39128405,"budgetRaw":"39128405","eaa":4143840,"eaaRaw":"4143840","partners":"American University of Beirut","partnerContrib":34984565,"country":"Lebanon","target":"316","demographic":"Marginalized Lebanese youth and Palestinian and Syrian refugee youth residing in Lebanon","update":"73% Lebanese - 27% Palestinian and Syrian\n\nas of Q2 2025:\n316 scholarships awarded \n299 graduates \n13 currently enrolled \n4 scholarships to be replaced\n\nWorking on incorporating 13 existing students into AUB 2","about":"Founded in 1866, the American University of Beirut is a teaching-centred research university based on the American liberal arts model of higher education. AUB has over 8,000 students and 800 faculty members. The University encourages freedom of thought and expression and seeks to graduate men and women committed to creative and critical thinking, lifelong learning, personal integrity, civic responsibility, and leadership.","from":"2021-08-01","to":"30/07/2025"},{"kind":"closed","title":"Professional Certificate for Young Refugees supported by Qatar Scholarship to Education Above All Foundation & the Ruth Stanton Foundation: Phase 2","type":"Scholarship","description":"The Professional Certificate for Young Refugees, which is unique in France, is a two-year diploma designed for young refugees whose education has been abruptly interrupted. The diploma is accredited by the Ministry of Education in France, and aims to facilitate students’ integration and equip students to access opportunities for further advancement, whether it be continuing with higher education or entering the job market.","duration":"","nstatus":"Closed","budget":3452506,"budgetRaw":"3452506","eaa":1381003,"eaaRaw":"1381003","partners":"Sciences Po","partnerContrib":2071503,"country":"France","target":"60","demographic":"Refugees and Asaylum seekers residing in France","update":"as of Q2 2026:\n\n52 scholarships awarded \n\n52 graduated","about":"Sciences Po’s overarching mission is to educate future leaders in the public and private sectors. Curious and open-minded, Sciences Po graduates, regardless of their focus\nand trajectory, all share the ability to “learn how to learn”, which is one of the priorities of our education.\nSciences Po's international dimension was established in its founding documents. Driven by this vocation\nfor nearly 150 years, today Sciences Po stands out as a world-class university, with internationallyrecognized\ndegrees and research, a multicultural community and a worldwide network of partners.","from":"2023-07-01","to":"2026-07-30"},{"kind":"closed","title":"Qatar Scholarship Program within the Sanctuary Scholarships to Education Above All Foundation/Somerville College Oxford","type":"Scholarship","description":"This project, implemented in partnership with Somerville College Oxford University (SCO), will provide the opportunity for up to 3 Forced Migrants per year for two years, for a project total target of 6 scholarships, to access world-renown higher education at Somerville College in the University of Oxford. Beneficiaries will complete one of Oxford University’s Master’s programs. \n\n As a University of Sanctuary, Sommerville College Oxford provides a package of individualized care and support, delivered by our dedicated Sanctuary Coordinator. This includes offers of counselling, mentorship and a regular programme of social and cultural events that enable scholars to meet and support each other.","duration":"","nstatus":"Closed","budget":391492,"budgetRaw":"391492","eaa":222528,"eaaRaw":"222528","partners":"Somerville College Oxford University","partnerContrib":168964,"country":"United Kingdom","target":"6","demographic":"Refugees and asylum seekers residing in the UK","update":"as of Q2 2026:\n\n6 scholarships awarded \n\n6 graduated","about":"In 2021, Somerville College Oxford University became one of the UK’s first University Colleges of Sanctuary. Our commitment to supporting people who today find themselves displaced by war, persecution and climate change is an extension of our College’s historic commitment to support sanctuary-seeking students and academics, Under this programme, Somerville has welcomed 29 Sanctuary Scholars to Somerville from regions including Ukraine, Sudan, Ethiopia and Afghanistan.","from":"2023-11-21","to":"2025-12-31"},{"kind":"excom","title":"Qatar Scholarship - EAA/Campus France","type":"Scholarship","description":"This initiative establishes the first formal agreement between EAA and the French Ministry of Europe & Foreign Affairs, in partnership with the French Ministry of Higher Education, implemented through Campus France. The project expands the UNIV’R (Université pour Réfugiés to University for Refugees) program, supporting 10 Francophone African refugees to pursue two-year Master’s degree programs in France. Students will receive comprehensive academic and living support, including tuition exemptions, stipends, health insurance, travel, accommodation, and career mentoring.","duration":"2.5 yrs","nstatus":"ExCom Approved","budget":747109,"budgetRaw":"747109","eaa":386615,"eaaRaw":"386615","partners":"Campus France","partnerContrib":360494,"country":"France","target":"10","demographic":"Francophone African refugees residing in France","update":"","about":"Campus France is the French public agency responsible for\ninternational academic mobility and operates under the authority of the French Ministry of Europe and\nForeign Affairs and the French Ministry of Higher Education and Research. It manages scholarship\nprogrammes on behalf of the French state and its partners and will oversee the end-to-end operational\ndelivery of the project","from":"","to":""},{"kind":"excom","title":"Qatar Scholarship - EAA/Sciences Po 3","type":"Scholarship","description":"The Professional Certificate for Young Refugees is a two-year diploma designed for young refugees whose education has been abruptly interrupted. The diploma is accredited by the Ministry of Education in France, and aims to facilitate students’ integration and equip students to access opportunities for further advancement, whether it be continuing with higher education or entering the job market. As part of Qatar Connection, participants in the Professional Certificate for Young Refugees will have the opportunity to participate in a special symposium on Education in Insecurity and Conflict, offered annually in France by Education Above All’s Protect Education in Conflict (PEIC) programme.","duration":"2 yrs","nstatus":"ExCom Approved","budget":1511667,"budgetRaw":"1511667","eaa":604667,"eaaRaw":"604667","partners":"Science Po","partnerContrib":907000,"country":"France","target":"30","demographic":"Refugees and Asylum Seekers residing in France.","update":"","about":"Sciences Po’s overarching mission is to educate future leaders in the public and private sectors. Curious and open-minded, Sciences Po graduates, regardless of their focus\nand trajectory, all share the ability to “learn how to learn”, which is one of the priorities of our education.\n\nSciences Po's international dimension was established in its founding documents. Driven by this vocation\nfor nearly 150 years, today Sciences Po stands out as a world-class university, with internationallyrecognized\ndegrees and research, a multicultural community and a worldwide network of partners.","from":"","to":""},{"kind":"excom","title":"Qatar Scholarship - EAA / American University of Beirut: Phase 2","type":"Scholarship","description":"Phase 2 of the Qatar Scholarship at AUB builds on a strong Phase 1 (2021-2025), where 77% of graduates are already employed at firms like PwC, BCG, and Qatar Airways, or pursuing advanced degrees at universities including Toronto, Munich, and Penn State. The expansion adds mandatory Qatar Connections engagement, a civic program through AUB's CCECS, and a study abroad track for 10 scholars at Education City in partnership with Qatar Foundation: leveraging AUB's #33 global ranking in graduate employability to deepen EAA's footprint in the Gulf.","duration":"3 yrs","nstatus":"ExCom Approved","budget":21354782,"budgetRaw":"21354782","eaa":4882549,"eaaRaw":"4882549","partners":"AUB","partnerContrib":16472233,"country":"Lebanon","target":"198","demographic":"Marginalized Youth","update":"","about":"Founded in 1866, the American University of Beirut is a teaching-centred research university based on the American liberal arts model of higher education. AUB has over 8,000 students and 800 faculty members. The University encourages freedom of thought and expression and seeks to graduate men and women committed to creative and critical thinking, lifelong learning, personal integrity, civic responsibility, and leadership.","from":"","to":""},{"kind":"excom","title":"Syria Post-Conflict Education Recovery Programme","type":"Emergency & Crisis Response","description":"The Education Above All (EAA) Foundation is partnering with the United Nations Development Programme (UNDP) to Syria Country Office to support Syria’s recovery through education, skills development, and economic empowerment. This project aims to enhance access to inclusive, quality education and employment pathways for Syrian youth and women, by restoring education systems, modernising TVET and higher education institutions, fostering entrepreneurship and freelancing opportunities, and integrating green skills, digital innovation, and climate education within learning and training programmes.","duration":"2 yrs","nstatus":"ExCom Approved","budget":24116591.81,"budgetRaw":"24116591.810000002","eaa":10727047.81,"eaaRaw":"10727047.81","partners":"UNDP","partnerContrib":13389544,"country":"Syria","target":"34,501","demographic":"AF: 4,895\nEAC: 24,200\nID: 1,500\nSilatech: 3,906","update":"","about":"34501","from":"","to":""},{"kind":"excom","title":"Qatar Scholarship to Pathways to Prosperity: Afghan Women (Vocational Education)","type":"Skills to Employment","description":"This initiative empowers 3,400 Afghan women through accredited vocational training leading to employment and income generation. Implemented by Lapis with the Ministry of Public Health (MoPH) and international partners, it features two tracks: Midwifery and Jewelry & Artisanal Skills. The midwifery component trains 2,000 women (half in-person and half via distance learning). The artisanal component trains 1,400 women in jewelry design (800 in-person and 600 via distance learning).","duration":"2 yrs","nstatus":"ExCom Approved\n(contingent on recognition by the Afghan Government)","budget":5038745,"budgetRaw":"5038745","eaa":2519372,"eaaRaw":"2519372","partners":"Lapis","partnerContrib":2519372,"country":"Afghanistan","target":"3400","demographic":"TVET programme providing midwifery training for 2,000 women and jewellery/artisanal training for 1,400 women.","update":"","about":"Founded in 2004, Lapis Group is an international development and strategic communications organisation working across the Middle East, Africa, Central and South Asia, and beyond. With operations spanning more than 20 countries, Lapis designs and delivers programmes in education and training, health, social and behaviour change, media, and civic engagement. The organisation works with governments, UN agencies, foundations, companies, and non-profit organisations, combining locally informed expertise, technology, communications, and community engagement to expand access to knowledge, skills, and opportunities, particularly in challenging and crisis-affected environments.","from":"","to":""},{"kind":"excom","title":"Qatar Scholarship -EAA/American College of Greece","type":"Scholarship","description":"This partnership between Education Above All (EAA) and The American College of Greece (ACG) will support 50 refugees and 4 marginalized Greek undergraduates in Greece, reflecting gender balance and diversity consistent with the refugee population in Athens. The project combines support for two complementary beneficiary groups: refugee, migrant, and displaced youth enrolled through ACG’s longstanding Education Unites programme, and financially vulnerable Greek youth who are alumni of the Antetokounmpo Academy. This proposal seeks to build an international collaboration between EAA, the Charles Antetokounmpo Family Foundation (founded by Giannis Antetokounmpo, former stateless youth turned global sports leader), and ACG (the only comprehensive higher education scholarship program for refugees and displaced youth in Greece). Together, these three organizations are united by a shared belief that education can transform lives and communities.","duration":"4 yrs","nstatus":"ExCom Approved","budget":2687392,"budgetRaw":"2687392","eaa":976061,"eaaRaw":"976061","partners":"American College of Greece","partnerContrib":1711331,"country":"Greece","target":"54","demographic":"Refugees and marginalized Greek nationals residing in Greece","update":"","about":"American College of Greece (ACG) is the oldest and largest American-accredited college in Europe, operating since 1875. Its undergraduate school grants US-accredited degrees recognized globally. ACG's longstanding refugee support programme in Athens, home to one of Europe's largest urban refugee populations, makes it an ideal partner for this dual-community scholarship initiative.","from":"","to":""},{"kind":"excom","title":"Qatar Scholarship -EAA/An-Najah National University (ANNU)","type":"Scholarship","description":"This partnership between Education Above All (EAA) and An-Najah National University (ANNU) will enable high-achieving, financially vulnerable Palestinian youth in the West Bank to pursue bachelor’s degrees and technical and vocational education and training (TVET) in priority fields, including medicine, engineering, information technology, and applied sciences. By expanding access to high-quality, market-relevant education at Palestine’s top-ranked university, the project will help safeguard educational continuity and strengthen national resilience.","duration":"3 yrs","nstatus":"ExCom Approved","budget":7305572,"budgetRaw":"7305572","eaa":3652786,"eaaRaw":"3652786","partners":"An-Najah National University (ANNU)","partnerContrib":3652786,"country":"Palestine","target":"1085","demographic":"Marginalized Youth","update":"","about":"An-Najah National University is a leading Palestinian higher education institution based in Nablus, Palestine. The University serves more than 23,000 students and offers a wide range of undergraduate and graduate programmes across fields including medicine, engineering, humanities, social sciences, and natural sciences. An-Najah combines teaching, research, innovation, and community engagement while maintaining a strong commitment to Palestinian history, heritage, and culture.","from":"","to":""},{"kind":"excom","title":"Qatar Scholarship to Bard College Partnership (Creative Economy-Integrated Scholarships)","type":"Scholarship","description":"The partnership between Education Above All (EAA) and Bard College will support 632 students to pursue internationally recognized higher education qualifications through a combination of bachelor’s, master’s, and associate degree pathways. The project will provide 252 four-year bachelor’s scholarships, 255 two-year Master of Arts in Teaching scholarships in Palestine at Al-Quds Bard College, and 125 two-year online Associate of Arts scholarships in Palestine and Afghanistan through Bard College, creating flexible pathways for students affected by mobility and access constraints. All scholarship programmes will integrate a Creative Economy Certificate designed by Bard College, equipping students with transferable skills in areas such as creative entrepreneurship, project management, cultural and creative arts management, and digital storytelling. Through this partnership, EAA and Bard College aim to expand access to quality higher education while strengthening employability, innovation, and economic resilience in communities facing significant educational and socioeconomic challenges.","duration":"8 yrs","n e role that media plays, for themselves, their communities and the region as whole. #QatarConnection","l":"","o":"","af":0},{"y":2021,"f":"Webinar","t":"About Qatar National Library","p":"QNL","w":"26 Jul 2021","n":158,"x":"The webinar will highlight the library vision, mission, and objectives. It will provide an overview of library history, achievements, and projects. Also, it will include a virtual tour of library building and facilities","l":"","o":"","af":0},{"y":2021,"f":"Webinar","t":"Get to Know QNL’s Helpful Services!","p":"QNL","w":"04 Aug 2021","n":158,"x":"The webinar will highlight QNL’s online services that the students can avail of such as the access to online resources and a variety of services such as research and writing services.","l":"","o":"","af":0},{"y":2021,"f":"Webinar","t":"Explore Qatar’s History and Culture Through QNL’s Initiatives","p":"QNL","w":"13 Sep 2021","n":76,"x":"The webinar will provide participants with an overview of QDL as one of the key QNL projects that is accessible worldwide online and for free. Participants will explore this platform that aims to preserve Qatar heritage and the region’s history.","l":"https://drive.google.com/drive/folders/1pqumLbfnb2GcDT4gxkN9oadbFGAPfCbA?usp=share_link QNL - 3 - Webinar - Explore Qatar's History","o":"","af":0},{"y":2021,"f":"Webinar","t":"An Introduction to IELTS: Academic Training","p":"QNL","w":"11 Oct 2021","n":106,"x":"The training aims to help students to prepare for IELTS exam.","l":"https://drive.google.com/drive/folders/12vKGvinYCP6IVjku_iqph2z0g4LZUUUy?usp=share_link","o":"","af":0},{"y":2021,"f":"Webinar","t":"What is plagiarism and how to avoid it?","p":"QNL","w":"04 Nov 2021","n":63,"x":"This training aims to introduce students to plagiarism and to provide them with useful techniques to avoid it.","l":"https://drive.google.com/drive/folders/1WvkrU43SwrwkYaDllD3jJrsB7VLFcEHb?usp=share_link","o":"","af":0},{"y":2021,"f":"Webinar","t":"Time Management Skills","p":"QNL","w":"10 Nov 2021","n":85,"x":"This training aims to introduce students to strategies to plan their time effectively","l":"https://drive.google.com/drive/folders/1LX9-OM646tFlBVtrw7MWfFcZKBP-ot9m?usp=share_link","o":"","af":0},{"y":2021,"f":"Webinar","t":"Stress Management and Problem-Solving Skills","p":"QNL","w":"18 Nov 2021","n":17,"x":"This training aims to help participants managing stress and overcoming problems","l":"https://drive.google.com/drive/folders/1sIuxvIJeRekSruKFuG0YCt9S59_-JXmZ?usp=share_link","o":"","af":0},{"y":2021,"f":"Training","t":"Mobile Jounalism, In-person | GAZA","p":"AJMI","w":"28-30 June","n":16,"x":"في غمرة التسارع التكنولوجي والطفرة الرقمية، التي طالت جميع مجالات الحياة، ظهر نوع جديد من الصحافة السمعية البصرية، التي فتحت المجال على مصراعيه لمحبي التصوير الميداني والتدوين والنشر لإيصال منتوجهم الصحفي الرقمي إلى أكبر شريحة من المجتمع. فعند وقوع الحدث لا شيء أسرع من هاتف ذكي يؤرخ للحظة بالصوت والصورة، وينقلها على عجل لجمهور واسع متعطش دوما للأخبار العاجلة. في هذه الدورة سيتمكن المتدربون من إعداد فيلم وثائقي مهني، يتم إنتاجه عبر التقنيات المتوفرة في الموبايل.","l":"https://drive.google.com/drive/folders/1qeQGAvNnn_TeQws09MD2MNr1jcd8KfCk?usp=sharing","o":"","af":0},{"y":2021,"f":"Training","t":"News Verification","p":"AJMI","w":"3-5 July","n":11,"x":"إن ظاهرة المعلومات المضللة والأخبار غير الصحيحة ليست بالجديدة، لكن مدى تأثيرها وتداولها خاصة من خلال وسائل التواصل الاجتماعي يجبر الصحفيين على التحقق من المحتوى، بغض النظر عن مصدره وعمن ينتجه. ومن هنا تأتي أهمية تحقق الصحفيين من صحة ودقة الأخبار المنشورة على المنصات الرقمية. تُتيح هذه الدورة التدريبية للمشاركين الأدوات والموارد اللازمة لاكتشاف المحتوى الذي يتم نشره على المنصات الرقمية والتحقق منه واستخدامه بطريقة أخلاقية.","l":"https://drive.google.com/drive/folders/19p6SH2W0eqqMfbGq7ZOBcaceCJvZrlnw?usp=share_link","o":"","af":0},{"y":2021,"f":"Training","t":"Basic of photography","p":"AJMI","w":"6-8 July","n":9,"x":"التصوير الفوتوغرافي ليس مجرد آلة تصوير يستطيع أن يقتنيها أي شاب، وليس أيضا مجرد الضغط على زر من أجل التقاط بعض الصور التذكارية، لكن ورغم بساطته الظاهرة يعتبر التصوير الفوتوغرافي فن رفيع يحتاج الى الكثير من المهارات التقنية، والجمالية من أجل الوصل إلى الإبداع والقدرة على التقاط الواقع بكل عفويه وصدق. هذه الدورة تعرف المتدرب على أسس التصوير الفوتوغرافي وفهمه فهما عميقا يجعله قادرا على تسجيل الواقع من حوله بطريقة أكثر جمالية وفائدة.","l":"https://drive.google.com/drive/folders/1Xrm2PwWxReSIS2Q-X8vJ64UlRooTnMnx?usp=share_link","o":"","af":0},{"y":2021,"f":"Webinar","t":"Introduction","p":"GA","w":"01 Oct 2021","n":34,"x":"","l":"","o":"","af":0},{"y":2021,"f":"Experience","t":"In-person","p":"WISE","w":"01 Nov 2021","n":6,"x":"6 selected students were selected to participate in the conference in Qatar","l":"","o":"","af":0},{"y":2021,"f":"Experience","t":"Festival, In-person","p":"GA","w":"01 Dec 2021","n":8,"x":"8 selected student were selected to attend the festival in Qatar","l":"","o":"","af":0},{"y":2022,"f":"Training","t":"Debate skills","p":"QatarDebate Center","w":"14 February 2022 6-week workshop, one per week","n":26,"x":"A 6-week workshop, one per week, on the art of debate provided by Qatar Debate Center. Sessions Topics: - Basics of public speaking & Persuasion skills - Introduction to debate skills - Case building and argumentation - Refutation & Speaker roles - Debate speeches and evaluation - Content based workshop - Practical debate exercises - Presentation skills","l":"https://drive.google.com/drive/folders/1u2qrNf7znr8BvsFKcL_JgFdSiBd6tMdw?usp=sharing","o":"","af":0},{"y":2022,"f":"Training","t":"CCNA virtual training","p":"Silatech","w":"The CCNA training will be divided into three courses in total; CCNA1: March 1st till April 5th CCNA2: April 12th till May 17th CCNA3: May 24th till June 28th","n":28,"x":"The CCNA-which stands for Cisco Certified Network Associate-is an entry-level information technology (IT) certification issued by Cisco. The CCNA is designed to validate your knowledge on fundamental networking concepts often requested in networking roles in IT positions.","l":"https://drive.google.com/drive/folders/1KGyigLdeALRhTHR0SW6YVkCH5fDN8jj5?usp=sharing","o":"","af":0},{"y":2022,"f":"Webinar","t":"Generation Amazing Introductory webinar","p":"Generation Amazing","w":"09 Mar 2022","n":39,"x":"The session presented Generation Amazing vision and mission, it’s philosophy and how football can be used as a tool to create positive social change. It also highlighted Generation Amazing work internationally, focusing mainly on Palestine and Jordan and introduced different opportunities were our students can be part of the programme.","l":"https://docs.google.com/document/d/1n8BJWLG42_q3-iYEY6S3ohQfzQxxyVv1/edit?usp=sharing&ouid=103486354251964929414&rtpof=true&sd=true","o":"","af":0},{"y":2022,"f":"Webinar","t":"Research process","p":"QNL","w":"20 Apr 2022","n":25,"x":"Students learned how to turn a topic into a research question, develop a research plan, conduct effective online searches, and evaluate your sources; these are all key skills that will greatly benefit them during their studies.","l":"https://drive.google.com/drive/folders/1i6d2hyVhMJNgEfiJaPvlkxw_zg46Sk9Y?usp=share_link","o":"","af":0},{"y":2022,"f":"Webinar","t":"IELTS Preparation","p":"QNL","w":"27 Apr 2022","n":40,"x":"IELTS is an international standardised test of English language proficiency for non-native English language speakers. The training aimed to help students to prepare for IELTS exam.","l":"https://drive.google.com/drive/folders/1Bz0PYQdGtHujO1mglQQPSNABzsfdMdCr?usp=sharing","o":"","af":0},{"y":2022,"f":"Webinar","t":"How to Use Google Scholar Effectively","p":"QNL","w":"18 May 2022","n":68,"x":"One of the most important skills students need in any field is how to effectively research. In this session students learned how to quickly search for Scholarly literature and discover how Google Scholar can help in searching for all needs from articles, journals and books across all disciplines.","l":"https://drive.google.com/drive/folders/1xisPv-hZpQD4LfGHWmXgSD4X1EpgqLup?usp=sharing","o":"","af":0},{"y":2022,"f":"Webinar","t":"Writing A Literature Review","p":"QNL","w":"25 May 2022","n":61,"x":"This session covered the basic concepts of a literature review. Students learned about how to structure a literature review and steps and strategies for writing one. Even if they have not written a literature review before, this session also helped with general writing skills.","l":"https://drive.google.com/drive/folders/1TqdJs8Z_0U9AZFa5OuAwUaZT_IQbJ7zJ?usp=sharing","o":"","af":0},{"y":2022,"f":"Webinar","t":"Designing Effective Presentations","p":"QNL","w":"01 Jun 2022","n":47,"x":"In this session, students learned how to be ready to design impactful presentations for any topic! The workshop focused on creating presentations that make an impact.","l":"https://drive.google.com/drive/folders/1lg_Fo3JLjLvZmI6AfrmBunPz5aDDbtva?usp=sharing","o":"","af":0},{"y":2022,"f":"Training","t":"Short Introductory Course on Research and Methodology","p":"ROTA In partnership with Doha International Family Institute.","w":"15,16, &19 June 2022","n":7,"x":"Introduction to action-oriented research related to social development. How to write proposals & literature reviews, Research methodology, How to write references Train the youth on how to investigate, design the research and then collect and analyze data","l":"https://drive.google.com/drive/folders/1_HyO3VRiXgG9tAbVOoUGePYHQVR42yRg?usp=sharing","o":"","af":0},{"y":2022,"f":"Training","t":"Storytelling for Digital Platforms","p":"AJMI","w":"12 - 14 June 2022","n":15,"x":"The use of digital platforms has forced the production of content that suits their different audiences and their technical characteristics. With these platforms capturing the public's attention, the options for their use have expanded from the press to the commercial sectors, official agencies, NGOs, and even personal goals. With the development of communication technology and technical tools, there are well-established foundations in building and producing the story that need to be learned and understood in order to adapt it to suit the nature of digital platforms and their audience.","l":"https://drive.google.com/drive/folders/1eeXSWqDyyyrLqhLhtr0UJpTiOQ3umwxf?usp=sharing https://drive.google.com/drive/folders/1iskMrt8Of05jUgminmwh73j0RiDwjHXf","o":"","af":0},{"y":2022,"f":"Webinar","t":"DFI- The world of film","p":"DFI","w":"15 Jun 2022","n":138,"x":"General webinar about DFI and how to apply to for Ajyal Film Festival Youth Juror","l":"https://drive.google.com/drive/folders/1NEisMOrqxxXk1WZ2bTJfekQZwtI-1hEB?usp=sharing","o":"","af":0},{"y":2022,"f":"Training","t":"Introduction to digital photography","p":"AJMI","w":"26 - 27 June 2022","n":18,"x":"“Photography is the icon of reality” Ronald Mountain Stills Photography is not simply a camera that everyone can buy and it is not simply pushing a button to shoot souvenir pictures. In spite of its apparent simplicity, stills photography is a noble art requiring a lot of technical and aesthetic skills in order to achieve creativity and the capability to shoot the reality with spontaneity and credibility. This training course will expose participants to the basics of stills photography and will help them to deeply understand it to enable them to record the reality around them in a more aesthetic and profitable way.","l":"https://drive.google.com/drive/folders/1nYztxNFc4f-PT-OFUfcMohXM4MAjPOW4?usp=sharing https://drive.google.com/drive/folders/1wstqhxkruwyq7fgw9e08Uwlhi0ae2-zN?usp=sharing","o":"","af":0},{"y":2022,"f":"Webinar","t":"Basics of Creative Writing","p":"QNL","w":"20 Jul 2022","n":95,"x":"You might have writing talents, but knowing where to begin your creative journey can be difficult. In the Creative Writing Skills workshop, you will learn how to write different pieces: articles, stories, and text for radio and TV. You will also learn simple methods to use your skills to effectively deliver information.","l":"https://drive.google.com/drive/folders/1vfaDyM85B_4uZVX1eOGL_XI0Tcn8mUEh?usp=sharing","o":"","af":0},{"y":2022,"f":"Webinar","t":"Negotiation and Persuasion Skills","p":"QNL","w":"22 Aug 2022","n":72,"x":"Want to become a more effective negotiator? This training aims to help participants learn negotiation skills and persuasion techniques","l":"https://drive.google.com/drive/folders/1i3qmoSnRdOL1-WJbVeH0PzwYPd4ta0FS?usp=sharing","o":"","af":0},{"y":2022,"f":"Webinar","t":"Public Speaking and Debate Workshop","p":"QNL","w":"31 Aug 2022","n":95,"x":"The workshop will teach students the basics of good public speaking, as well as the skills needed to successfully debate important issues.","l":"https://drive.google.com/drive/folders/1ybmQsS1hZe_Ryf3y-8-QqlF6uwS6sK0J?usp=sharing","o":"","af":0},{"y":2022,"f":"Training","t":"Ajyal film festival (Jury experience)","p":"DFI","w":"1-8 oct 2022","n":15,"x":"The Doha Film Institute is delighted to present 2022 Special Edition of the Ajyal Film Festival from 1-8 October. The unmissable Jury Experience will give selected jurors access to the very best in international cinema, inspiring talks, exciting workshops and thought-provoking masterclasses-all in an innovative hybrid format. The Ajyal Jury Competition is the core component of the festival and presents our jurors aged 8-25 with the incredible opportunity to decide Ajyal’s competition winners. The directors of the winning films are granted funding toward their next film, so jurors are empowered to support and promote future content that is relevant and meaningful to them.","l":"https://drive.google.com/drive/folders/1juye7J4f1vb8gqU2EtRTApqKq4EaH_vX?usp=sharing","o":"","af":0},{"y":2022,"f":"Training","t":"News verification","p":"AJMI","w":"2 - 3 - 4 Oct 2022","n":20,"x":"This course allows participants to learn ground rules for ethical discovery, verification and use of open source content, and to implement effective workflows in newsroom and more based on t async function readKind(k){
  const m = await db.doc('dataset/' + k).get();
  if (!m.exists) return null;
  const man = m.data();
  const parts = await Promise.all(Array.from({length: man.n}, (_, i) => db.doc('dataset/' + k + '/chunks/' + man.ver + '-' + i).get()));
  if (parts.some(p => !p.exists)) throw new Error('missing chunk');
  return {man, piece: JSON.parse(parts.map(p => p.data().s).join(''))};
}
async function loadStore(){
  db = await window.claude.use('db');
  if (!db) return;
  const res = await Promise.all(KINDS.map(k => readKind(k).catch(() => null)));
  KINDS.forEach((k, i) => { if (res[i]) { STORE[k] = res[i].man; PIECES[k] = res[i].piece; myVer[k] = res[i].man.ver; } });
}
async function writeKind(k, piece, file, by){
  const s = JSON.stringify(piece), ver = Date.now().toString(36) + Math.random().toString(36).slice(2, 6), n = Math.ceil(s.length / CHUNK);
  for (let i = 0; i < n; i++) await db.doc('dataset/' + k + '/chunks/' + ver + '-' + i).set({s: s.slice(i * CHUNK, (i + 1) * CHUNK)});
  const prev = STORE[k] ? {ver: STORE[k].ver, n: STORE[k].n, file: STORE[k].file, at: STORE[k].at} : null;
  const man = {ver, n, file, at: new Date().toISOString(), by: by || '', prev};
  await db.doc('dataset/' + k).set(man);
  // drop chunks older than the previous version
  const old = STORE[k] && STORE[k].prev;
  if (old && old.ver !== ver) for (let i = 0; i < old.n; i++) db.doc('dataset/' + k + '/chunks/' + old.ver + '-' + i).delete().catch(() => {});
  STORE[k] = man; myVer[k] = ver;
}
async function revertKind(k){
  const cur = STORE[k]; if (!cur) return;
  if (cur.prev) { const man = Object.assign({}, cur.prev, {prev: null, at: new Date().toISOString(), revertedFrom: cur.file}); await db.doc('dataset/' + k).set(man); myVer[k] = man.ver;
    for (let i = 0; i < cur.n; i++) db.doc('dataset/' + k + '/chunks/' + cur.ver + '-' + i).delete().catch(() => {}); }
  else { await db.doc('dataset/' + k).delete(); myVer[k] = null; for (let i = 0; i < cur.n; i++) db.doc('dataset/' + k + '/chunks/' + cur.ver + '-' + i).delete().catch(() => {}); }
}
